<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F8FA;color:#333333;display:flex;justify-content:center;min-height:100vh}
.main{width:100%;max-width:1040px;padding:24px 16px 40px}

/* Header */
.hd{text-align:center;padding:8px 0 16px}
.hd h1{font-size:18px;font-weight:700;color:#333333;letter-spacing:.5px}
.hd .sub{font-size:10px;color:#888888;margin:4px 0 8px}
.hd a{display:inline-block;font-size:9px;color:#888888;text-decoration:none;padding:3px 12px;border:1px solid #e0e0e0;border-radius:14px}
.hd a:hover{color:#1954C9;border-color:#1954C9}

/* KPI row */
.kpi{display:flex;gap:14px;margin-bottom:20px}
.kpi-card{border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.06);min-height:90px}
.kpi-card.rev{flex:2;background:linear-gradient(135deg,#1954C9,#1340a0);color:#fff}
.kpi-card.sales{flex:1;background:#fff;border:1px solid #e0e0e0}
.kpi-card.skus{flex:1;background:#e8f0fe;border:1px solid #c5d9f7}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-card.rev .kpi-lbl{color:#93b4f5}
.kpi-card.sales .kpi-lbl{color:#888888}
.kpi-card.skus .kpi-lbl{color:#1954C9}
.kpi-val-row{display:flex;align-items:baseline;gap:6px}
.kpi-card.rev .kpi-val{font-size:30px;font-weight:700;font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace;color:#fff}
.kpi-card.sales .kpi-val{font-size:30px;font-weight:700;font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace;color:#1954C9}
.kpi-card.skus .kpi-val{font-size:30px;font-weight:700;font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace;color:#1954C9}
.kpi-unit{font-size:12px;opacity:.7}
.kpi-card.rev .kpi-unit{color:#93b4f5}
.kpi-card.sales .kpi-unit,.kpi-card.skus .kpi-unit{color:#888888}
.kpi-sub{font-size:9px;color:#888888;margin-top:4px}

/* Middle: 2-col */
.mid{display:flex;gap:14px;margin-bottom:20px}
.mid-left{flex:1.2;min-width:0}
.mid-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}

/* Card */
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.card-title{font-size:12px;font-weight:600;color:#333333;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';width:3px;height:14px;background:#1954C9;border-radius:2px}
.card svg{display:block;width:100%}

/* Footer */
.ft{text-align:center;padding:16px;color:#d0d0d0;font-size:9px}

@media(max-width:768px){
  .mid{flex-direction:column}
  .kpi{flex-wrap:wrap}
  .kpi-card.rev{flex:1 1 100%}
  .kpi-card.sales,.kpi-card.skus{flex:1;min-width:120px}
  .kpi-val{font-size:24px!important}
}
</style>
