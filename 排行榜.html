<title>📊 销量排行榜 · Wearing Notes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F6F7F9;color:#1a1a2e;display:flex;justify-content:center;min-height:100vh}
.main{width:100%;max-width:960px;padding:20px 12px 40px}

.hd{text-align:center;padding:12px 0 4px}
.hd h1{font-size:18px;font-weight:700}
.hd .sub{font-size:10px;color:#6b7280;margin:2px 0 8px}
.hd a{display:inline-block;font-size:9px;color:#6b7280;text-decoration:none;padding:3px 12px;border:1px solid #e5e7eb;border-radius:14px}
.hd a:hover{color:#0891b2;border-color:#0891b2}

/* KPI */
.kpi{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi-card{border-radius:12px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;justify-content:center}
.kpi-card.rev{flex:2;background:linear-gradient(135deg,#1e3a5f,#1a365d);color:#fff;min-width:200px}
.kpi-card.qty{flex:1;background:#fff;border:1px solid #e5e7eb;min-width:120px}
.kpi-card.sku{flex:1;background:#f0f9ff;border:1px solid #bae6fd;min-width:120px}
.kpi-card .kpi-val{font-size:32px;font-weight:700;font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace}
.kpi-card .kpi-curr{font-size:14px;font-weight:400;margin-left:4px;opacity:.8}
.kpi-card.rev .kpi-val{color:#67e8f9}
.kpi-card.qty .kpi-val{color:#7c3aed}
.kpi-card.sku .kpi-val{color:#0891b2}
.kpi-card .kpi-lbl{font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.kpi-card.rev .kpi-lbl{color:#94a3b8}
.kpi-card.qty .kpi-lbl{color:#6b7280}
.kpi-card.sku .kpi-lbl{color:#6b7280}

/* 2-col layout */
.two-col{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.col-left{flex:1;min-width:380px}
.col-right{width:300px;display:flex;flex-direction:column;gap:14px}
.ch{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.ch svg{display:block}

.ft{text-align:center;padding:16px;color:#d1d5db;font-size:9px}

@media(max-width:700px){
  .two-col{flex-direction:column}
  .col-right{width:100%;flex-direction:row;flex-wrap:wrap}
  .col-right .ch{flex:1;min-width:140px}
  .kpi-card.rev{flex:1 1 100%}
  .kpi-card .kpi-val{font-size:24px}
}
</style>
</head>
