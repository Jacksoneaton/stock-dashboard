<title>📊 数据看板 · Wearing Notes</title>
<style>
:root{--brand:#0052d9;--brand-hover:#366ef4;--brand-light:#f2f3ff;--bg:#eee;--card:#fff;--border:#e8e8e8;--text:rgba(0,0,0,.9);--muted:rgba(0,0,0,.6);--dim:rgba(0,0,0,.4);--shadow:0 1px 10px rgba(0,0,0,.05), 0 4px 5px rgba(0,0,0,.08);--radius:6px;--radius-lg:9px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.page{padding:20px 24px;max-width:1200px;margin:0 auto}
.page-header{padding:12px 0 20px;display:flex;align-items:center;justify-content:space-between}
.page-header h1{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.page-header .meta{font-size:12px;color:var(--dim)}
.page-header a{font-size:12px;color:var(--brand);text-decoration:none;padding:4px 14px;border:1px solid var(--brand);border-radius:3px;transition:all .2s}
.page-header a:hover{background:var(--brand);color:#fff}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.kpi-label{font-size:12px;color:var(--dim);margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:600;color:var(--text);font-family:'SF Mono','Menlo','Consolas',monospace;letter-spacing:-.02em}
.kpi-value.accent{color:var(--brand)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.kpi-sub.up{color:#2ba471}.kpi-sub.down{color:#d54941}

/* 2-col content */
.content{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--brand);border-radius:2px}
.card svg{display:block;width:100%}

/* Bottom row */
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.footer{text-align:center;padding:20px;font-size:11px;color:var(--dim)}

@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .content,.bottom-row{grid-template-columns:1fr}
  .page{padding:12px 10px}
  .kpi-value{font-size:22px}
}
</style>
</head>
