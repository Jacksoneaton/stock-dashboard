<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏢 公司看板</title>
<style>
/* ══════ Ant Design Pro Dashboard ══════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f2f5;--card-bg:#fff;--border:#f0f0f0;--border-light:#e8e8e8;
  --text:#262626;--text-secondary:#595959;--muted:#8c8c8c;--dim:#d9d9d9;
  --primary:#1890ff;--cyan:#1890ff;--green:#52c41a;--yellow:#faad14;--red:#ff4d4f;--purple:#722ed1;
  --orange:#fa8c16;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  --shadow:0 3px 6px -4px rgba(0,0,0,.12),0 6px 16px 0 rgba(0,0,0,.08),0 9px 28px 8px rgba(0,0,0,.05);
  --shadow-lg:0 6px 16px -8px rgba(0,0,0,.08),0 9px 28px 0 rgba(0,0,0,.05),0 12px 48px 16px rgba(0,0,0,.03);
  --radius:8px;--radius-sm:6px;--radius-lg:8px;--radius-full:20px;
  --font-title:16px;--font-body:14px;--font-helper:12px;
  --spacing-xs:4px;--spacing-sm:8px;--spacing-md:16px;--spacing-lg:20px;--spacing-xl:24px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;height:auto}

/* ── Sidebar ── */
.sidebar{width:100%;max-width:220px;background:var(--card-bg);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;box-shadow:var(--shadow-sm);position:relative;z-index:2;overflow-y:auto}
.sidebar .brand{font-size:15px;font-weight:600;padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:4px;color:var(--text);letter-spacing:-.2px}
.sidebar .brand span{color:var(--primary)}
.sidebar .section{font-size:10px;color:var(--muted);padding:12px 20px 4px;text-transform:uppercase;letter-spacing:.6px;font-weight:500}
.sidebar .shop{display:block;padding:7px 20px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;margin:0}
.sidebar .shop:hover{background:rgba(24,144,255,.06);color:var(--primary)}
.sidebar .shop.active{color:var(--primary);font-weight:600;background:rgba(24,144,255,.08);border-left:3px solid var(--primary);border-radius:0 4px 4px 0}
.sidebar .shop .count{float:right;font-size:10px;color:var(--muted);margin-top:2px}
.sidebar .realtime-nav{display:block;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;border-bottom:1px solid var(--border);margin-bottom:6px;color:var(--purple);background:linear-gradient(135deg,rgba(114,46,209,.04),transparent)}
.sidebar .realtime-nav:hover{background:rgba(114,46,209,.08);color:var(--purple)}
.sidebar .realtime-nav.active{color:var(--purple);font-weight:700;background:rgba(114,46,209,.1);border-left:3px solid var(--purple);border-radius:0 4px 4px 0}

/* ── Main ── */
.main{flex:1;min-width:0;padding:24px;overflow-y:auto;max-width:1440px;margin:0 auto}

/* ── Title Bar (24 cols) ── */
.page-header{background:var(--card-bg);border-radius:var(--radius);padding:20px 24px;margin-bottom:var(--spacing-lg);box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0;color:var(--text);display:flex;align-items:center;gap:8px}
.page-header h1 .store-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--primary);color:#fff;border-radius:6px;font-size:14px}
.page-header .meta{font-size:var(--font-helper);color:var(--muted);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.page-header .meta .meta-item{display:flex;align-items:center;gap:4px}
.page-header .meta .meta-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.page-header .meta .meta-val{color:var(--text-secondary);font-weight:500}

/* ── Date tabs ── */
.date-tabs{display:flex;gap:8px;margin-bottom:var(--spacing-lg);flex-wrap:wrap}
.date-tab{padding:4px 15px;border-radius:2px;font-size:var(--font-body);cursor:pointer;background:transparent;border:none;color:var(--text-secondary);transition:all .3s;line-height:1.5715;height:32px;display:inline-flex;align-items:center;position:relative}
.date-tab:hover{color:var(--primary)}
.date-tab.active{color:var(--primary);font-weight:500}
.date-tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--primary);border-radius:1px}

/* ── KPI Cards (24 cols, 5 uniform) ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--spacing-lg);margin-bottom:var(--spacing-lg)}
.kpi-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);text-align:center;transition:box-shadow .3s;cursor:default;border:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px}
.kpi-card:hover{box-shadow:var(--shadow)}
.kpi-card .val{font-size:30px;font-weight:600;line-height:1.2;color:var(--text);margin-bottom:4px}
.kpi-card .lbl{font-size:var(--font-body);color:var(--muted);margin-top:4px}
.kpi-card.orange .val{color:var(--orange)}
/* All others use default text color */

/* ── View switch ── */
.view-switch{display:flex;gap:8px;margin-bottom:var(--spacing-lg)}
.view-switch .vs-btn{padding:4px 15px;border-radius:2px;font-size:var(--font-body);cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-secondary);transition:all .3s;font-weight:400;height:32px;display:inline-flex;align-items:center}
.view-switch .vs-btn:hover{color:var(--primary);border-color:var(--primary)}
.view-switch .vs-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}


/* ── Real-time Dashboard ── */
.rt-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.rt-kpi{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);border-left:3px solid var(--primary)}
.rt-kpi .rt-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.rt-kpi .rt-val{font-size:22px;font-weight:700;color:var(--text)}
.rt-kpi .rt-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.rt-kpi.green{border-left-color:var(--green)}
.rt-kpi.red{border-left-color:var(--red)}
.rt-kpi.yellow{border-left-color:var(--yellow)}
.rt-kpi.purple{border-left-color:var(--purple)}
.store-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;align-items:center}
.store-filter .sf-label{font-size:12px;color:var(--muted);margin-right:4px}
.store-filter .sf-pill{padding:4px 12px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);transition:all .2s;white-space:nowrap}
.store-filter .sf-pill.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.store-filter .sf-pill.excluded{background:var(--red);color:#fff;border-color:var(--red);text-decoration:line-through}
.store-filter .sf-quick{font-size:11px;color:var(--primary);cursor:pointer;margin-left:4px;padding:2px 8px;border-radius:4px;border:1px solid var(--primary);background:transparent}
.store-filter .sf-quick:hover{background:var(--primary);color:#fff}
.rt-chart-bar{display:flex;align-items:center;margin-bottom:6px;gap:8px}
.rt-chart-bar .rt-bar-name{width:140px;font-size:12px;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.rt-chart-bar .rt-bar-track{flex:1;background:var(--border);border-radius:4px;height:20px;overflow:hidden;position:relative;min-width:40px}
.rt-chart-bar .rt-bar-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s ease}
.rt-chart-bar .rt-bar-val{width:80px;font-size:11px;color:var(--text);flex-shrink:0;white-space:nowrap}
.rt-orders-table{width:100%;border-collapse:collapse;font-size:12px}
.rt-orders-table th{text-align:left;padding:8px 10px;background:var(--bg);color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
.rt-orders-table td{padding:8px 10px;border-bottom:1px solid var(--border-light)}
.rt-orders-table tr:hover{background:rgba(24,144,255,.03)}
@media(max-width:768px){
  .rt-kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .rt-kpi{padding:12px}
  .rt-kpi .rt-val{font-size:18px}
  .rt-chart-bar .rt-bar-name{width:90px;font-size:11px}
  .rt-chart-bar .rt-bar-val{width:60px;font-size:10px}
  .rt-orders-table{font-size:11px}
  .rt-orders-table th,.rt-orders-table td{padding:6px}
}

/* ── Sub tabs (Ant Design style top nav tabs) ── */
.sub-tabs{display:flex;gap:0;margin-bottom:var(--spacing-lg);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.sub-tab{padding:6px 16px;font-size:var(--font-body);cursor:pointer;color:var(--text-secondary);transition:all .3s;position:relative;white-space:nowrap;background:transparent;border:none;border-radius:0;display:inline-flex;align-items:center;gap:4px;height:40px}
.sub-tab:hover{color:var(--primary)}
.sub-tab.active{color:var(--primary);font-weight:500}
.sub-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--primary);border-radius:1px 1px 0 0}
.sub-tab .count-badge{font-size:10px;background:var(--red);color:#fff;padding:0 5px;border-radius:8px;line-height:16px;height:16px;display:inline-flex;align-items:center;font-weight:400}

/* ── Main Content Grid (16+8) ── */
.content-grid{display:grid;grid-template-columns:2fr 1fr;gap:var(--spacing-lg);align-items:start}
.content-grid.full{grid-template-columns:1fr}

/* ── Ant Design Card ── */
.ad-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:var(--spacing-lg);border:1px solid var(--border-light)}
.ad-card:last-child{margin-bottom:0}
.ad-card .ad-card-head{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ad-card .ad-card-head .ad-card-title{font-size:16px;font-weight:600;color:var(--text);margin:0}
.ad-card .ad-card-body{padding:0;overflow-x:auto}

/* ── Ant Design Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:var(--font-body)}
.data-table thead th{background:#fafafa;padding:12px 16px;text-align:left;font-weight:600;color:var(--text-secondary);font-size:var(--font-body);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table tbody td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;transition:background .2s}
.data-table tbody tr:hover td{background:rgba(24,144,255,.02)}
.data-table tbody tr:nth-child(even) td{background:rgba(0,0,0,.005)}
.data-table tbody tr:nth-child(even):hover td{background:rgba(24,144,255,.03)}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.data-table .text-left{text-align:left}

/* Status pills */
.status-pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;line-height:20px;white-space:nowrap}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.status-dot.shipped{background:var(--green)}.status-dot.pending{background:var(--orange)}.status-dot.completed{background:var(--primary)}.status-dot.cancelled{background:var(--red)}

/* Section title (for non-card sections) */
.sec-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text)}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:var(--muted);font-size:var(--font-body)}
.empty-state small{display:block;margin-top:4px;color:var(--dim)}

/* ── Order cards in right panel ── */
.order-card-list{display:flex;flex-direction:column;overflow-y:scroll!important;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.order-card-list::-webkit-scrollbar{width:6px}
.order-card-list::-webkit-scrollbar-thumb{background:#bfbfbf;border-radius:3px}
.order-card-list::-webkit-scrollbar-thumb:hover{background:#8c8c8c}
.order-card-list::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:3px}
.order-card{border-bottom:1px solid var(--border);padding:16px 24px;transition:background .2s}
.order-card:last-child{border-bottom:none}
.order-card:hover{background:rgba(24,144,255,.01)}
.order-card .oc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.order-card .oc-sn{font-size:var(--font-helper);color:var(--primary);font-weight:500;font-family:'SF Mono',Monaco,'Cascadia Code',monospace}
.order-card .oc-time{font-size:var(--font-helper);color:var(--muted)}
.order-card .oc-total{font-size:var(--font-helper);color:var(--text-secondary);white-space:nowrap;font-weight:500}
.order-card .oc-items{display:flex;flex-direction:column;gap:6px}
.order-card .oc-item{display:flex;align-items:center;gap:10px;font-size:var(--font-body)}
.order-card .oc-item img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--bg)}
.order-card .oc-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.order-card .oc-item-meta{font-size:var(--font-helper);color:var(--muted);margin-top:1px}
.order-card .oc-item-price{font-weight:500;color:var(--text);white-space:nowrap}

/* ── Stock warning ── */
.stock-warn{color:var(--red);font-weight:500}
.stock-warn-badge{display:inline-block;padding:0 6px;font-size:11px;background:rgba(255,77,79,.1);color:var(--red);border-radius:4px;line-height:20px;margin-left:4px}

/* ── Action buttons ── */
.btn-primary{padding:4px 15px;font-size:var(--font-body);background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:2px;cursor:pointer;transition:all .3s;height:32px;display:inline-flex;align-items:center;gap:4px;line-height:1.5715}
.btn-primary:hover{background:#40a9ff;border-color:#40a9ff}
.btn-default{padding:4px 15px;font-size:var(--font-body);background:var(--card-bg);color:var(--text-secondary);border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all .3s;height:32px;display:inline-flex;align-items:center;gap:4px;line-height:1.5715}
.btn-default:hover{color:var(--primary);border-color:var(--primary)}
.btn-danger{padding:4px 15px;font-size:var(--font-body);background:var(--card-bg);color:var(--red);border:1px solid var(--red);border-radius:2px;cursor:pointer;transition:all .3s;height:32px;display:inline-flex;align-items:center;line-height:1.5715}
.btn-danger:hover{background:rgba(255,77,79,.06)}
.btn-sm{padding:2px 8px;font-size:12px;height:24px;border-radius:2px}
.btn-link{padding:0;font-size:var(--font-body);background:transparent;border:none;color:var(--primary);cursor:pointer;transition:color .3s}
.btn-link:hover{color:#40a9ff}

/* ── Ant Design filters ── */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-pill{padding:4px 12px;font-size:var(--font-helper);border-radius:2px;cursor:pointer;background:var(--card-bg);border:1px solid var(--border);color:var(--text-secondary);transition:all .3s;height:28px;display:inline-flex;align-items:center;gap:4px;line-height:1.5715}
.filter-pill:hover{color:var(--primary);border-color:var(--primary)}
.filter-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Utility: right-align ── */
.text-right{text-align:right}
.text-center{text-align:center}
.mt-lg{margin-top:var(--spacing-lg)}
.mb-lg{margin-bottom:var(--spacing-lg)}

/* ── Store header (for non-Ant-Design pages like refund/trends/inventory) ── */
.store-header{background:var(--card-bg);border-radius:var(--radius);padding:16px 24px;margin-bottom:var(--spacing-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.store-header h1{font-size:20px;font-weight:600;margin:0}
.store-header .meta{font-size:var(--font-helper);color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ── Refund (preserved from old styles) ── */
.refund-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.refund-summary .rs{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.rs-num{font-size:22px;font-weight:700}
.rs-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.rs-num.ac{color:var(--primary)}.rs-num.gr{color:var(--green)}.rs-num.pu{color:var(--purple)}.rs-num.rd{color:var(--red)}
.refund-filters{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.rf-pill{padding:6px 14px;min-height:36px;border-radius:var(--radius);font-size:var(--font-helper);cursor:pointer;color:var(--text-secondary);background:var(--card-bg);border:1px solid var(--border);transition:all .2s;user-select:none;display:inline-flex;align-items:center;gap:2px}
.rf-pill b{font-weight:600;color:var(--text);margin-left:2px}
.rf-pill:hover{border-color:var(--primary);color:var(--primary)}
.rf-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.rf-pill.active b{color:#fff}
.refund-date-group{margin-bottom:16px}
.refund-date-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;padding:8px 0}
.refund-date-hd .rd-dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.refund-date-hd .rd-label{font-size:13px;font-weight:600;color:var(--text)}
.refund-date-hd .rd-count{font-size:10px;color:var(--muted)}
.refund-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:all .15s;box-shadow:var(--shadow-sm)}
.refund-card:hover{border-color:rgba(24,144,255,.3);box-shadow:var(--shadow)}
.refund-card-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.01)}
.refund-badge{padding:2px 10px;border-radius:8px;font-size:10px;font-weight:600}
.refund-badge.exact{background:rgba(5,150,105,.1);color:#059669}
.refund-badge.fuzzy{background:rgba(114,46,209,.1);color:#722ed1}
.refund-score{font-size:10px;color:var(--muted);margin-left:auto}
.refund-card-body{padding:12px 14px}
.refund-card-body .cols{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.refund-col{min-width:0;display:flex;flex-direction:column;gap:3px}
.refund-col .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px}
.refund-match-reason{font-size:9px;color:var(--green);background:rgba(5,150,105,.05);border-radius:4px;padding:2px 8px;display:inline-flex;align-items:center;gap:3px}
.refund-arrow{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px;flex-shrink:0;padding-top:12px}
.refund-title{cursor:pointer;font-size:12px;font-weight:600;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.refund-title:hover{color:var(--primary)}
.refund-title.expanded{-webkit-line-clamp:unset;display:block}
.refund-spec{font-size:11px;color:var(--muted);line-height:1.3}
.refund-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.refund-meta code{font-family:monospace;font-size:10px;color:var(--primary);background:rgba(24,144,255,.06);padding:1px 6px;border-radius:4px}
.refund-empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:12px}

/* ── Inventory styles ── */
.section-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.inv-warehouse-btn.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.refund-filter.active{box-shadow:0 0 0 2px var(--primary)!important}
tr.over-alloc{background:rgba(255,77,79,.06)!important}
tr.over-alloc:hover{background:rgba(255,77,79,.12)!important}
.export-picker-btn:hover{background:var(--bg)!important}

/* ── Global view ── */
.global-matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.global-matrix-wrap table{border-collapse:collapse;font-size:11px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);width:max-content;min-width:100%}
.global-matrix-wrap th{background:var(--bg);padding:8px 6px;text-align:center;font-weight:600;color:var(--muted);font-size:10px;position:sticky;top:0;z-index:1;white-space:nowrap}
.global-matrix-wrap th:first-child{text-align:left;min-width:200px;position:sticky;left:0;z-index:2;background:var(--bg)}
.global-matrix-wrap td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;min-width:44px;font-size:11px;user-select:none}
.global-matrix-wrap td:first-child{text-align:left;font-size:10px;white-space:nowrap;position:sticky;left:0;background:var(--card-bg);z-index:1;font-weight:500;cursor:default}
.global-matrix-wrap tr:hover td{background:rgba(24,144,255,.04)}
.global-matrix-wrap tr:hover td:first-child{background:rgba(24,144,255,.04)}
.global-matrix-wrap .cell-has{color:var(--primary);font-weight:600}
.global-matrix-wrap .cell-none{color:var(--dim)}
.global-matrix-wrap .cell-has:hover{background:rgba(24,144,255,.15)!important;border-radius:3px}
.global-matrix-wrap .cell-none:hover{background:rgba(24,144,255,.06)!important;border-radius:3px;color:var(--primary)}
.global-matrix-wrap .row-total{font-weight:700;color:var(--text);cursor:default}
.global-search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px;font-size:var(--font-helper)}
.global-pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:12px;font-size:11px}
.global-pagination button{padding:4px 12px;border:1px solid var(--border);background:var(--card-bg);border-radius:4px;cursor:pointer;font-size:11px}
.global-pagination button:disabled{opacity:.4;cursor:default}

/* ── Trends bar chart ── */
.trends-bar-wrap{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.trends-bar-row{display:flex;align-items:center;gap:8px}
.trends-bar-row .rank{width:24px;text-align:right;font-size:10px;color:var(--muted);flex-shrink:0}
.trends-bar-row .kw{width:90px;font-size:var(--font-helper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.trends-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:40px}
.trends-bar-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--purple));border-radius:3px;transition:width .6s ease}
.trends-bar-row .vol{font-size:10px;font-weight:500;min-width:50px;text-align:right;flex-shrink:0}

/* ── Pagination ── */
.data-table-pagi{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--border);font-size:var(--font-body)}
.data-table-pagi button{padding:2px 8px;border:1px solid var(--border);background:var(--card-bg);border-radius:2px;cursor:pointer;font-size:var(--font-helper);height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center;transition:all .3s}
.data-table-pagi button:hover{color:var(--primary);border-color:var(--primary)}
.data-table-pagi button:disabled{opacity:.4;cursor:default}
.data-table-pagi .pagi-info{color:var(--muted);font-size:var(--font-helper)}

function getDateRange(period){
  var now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var end = new Date(d.getTime() + 86400000);
  var start;
  switch(period){
    case 'today': start = d; break;
    case 'yesterday': start = new Date(d.getTime() - 86400000); end = d; break;
    case '7days': start = new Date(d.getTime() - 6*86400000); break;
    case '30days': start = new Date(d.getTime() - 29*86400000); break;
    case 'month': start = new Date(now.getFullYear(), now.getMonth(), 1); break;
    default: start = d;
  }
  return {start:start, end:end};
}

  var m = {'READY_TO_SHIP':'待发货','SHIPPED':'已发货','COMPLETED':'已完成','CANCELLED':'已取消','TO_CONFIRM_RECEIVE':'待确认'};
  return '<span class="status-pill" style="color:'+getStatusColor(s)+';background:'+getStatusBg(s)+'">'+(m[s]||s)+'</span>';
}
function getStatusColor(s){
  var c = {'READY_TO_SHIP':'#b45309','SHIPPED':'#166534','COMPLETED':'#3730a3','CANCELLED':'#991b1b','TO_CONFIRM_RECEIVE':'#b45309'};
  return c[s]||'var(--muted)';
}
function getStatusBg(s){
  var b = {'READY_TO_SHIP':'rgba(245,158,11,.12)','SHIPPED':'rgba(34,197,94,.12)','COMPLETED':'rgba(99,102,241,.12)','CANCELLED':'rgba(239,68,68,.08)','TO_CONFIRM_RECEIVE':'rgba(245,158,11,.12)'};
  return b[s]||'var(--bg)';
}

function fmtImg(pic, name){
  if(!pic) return (name||'');
  var safe = (name||'').replace(/"/g,'&quot;');
  return '<img src="'+pic+'" style="width:48px;height:48px;object-fit:cover;border-radius:4px;vertical-align:middle" title="'+safe+'" data-name="'+safe+'" onerror="imgOnError(this)">';
}

// Image error handler — reads fallback text from data-name attribute (safe, no inline escaping)
function imgOnError(img) {
  img.style.display = 'none';
  var name = img.getAttribute('data-name') || '';
  if (name) {
    var span = document.createElement('span');
    span.textContent = name;
    img.parentNode.insertBefore(span, img.nextSibling);
  }
}
function imgHide(img){img.style.display="none"}

    html += '<button data-inv-page="next"' + (_invPage >= totalPages ? ' disabled' : '') + '>▶</button>';
    html += '</div>';
    html += '</div></div>';
  }
  
  // Assign modal (hidden)
  html += '<div id="assignModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center">'
    + '<div style="background:#fff;border-radius:12px;padding:24px;min-width:320px;max-width:400px;box-shadow:var(--shadow-xl)">'
    + '<h3 style="margin-bottom:12px">📦 分配保留数量</h3>'
    + '<div id="assignProduct" style="font-size:13px;color:var(--muted);margin-bottom:4px;max-height:60px;overflow:hidden"></div><div id="assignSpec" style="font-size:11px;color:var(--cyan);margin-bottom:8px"></div>'
    + '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">店铺: <span id="assignStore"></span></div>'
    + '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">总库存: <span id="assignTotal"></span> 件 | 共享可售: <span id="assignShared"></span> 件</div>'

    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button data-action="closeAssign" class="btn-default">取消</button>'
    + '<button data-action="saveAssign" class="btn-primary">保存</button>'
  html += '</div></div>';  // close assign modal
  
  // Reservation change log — now as popup button
  html += '<div style="margin-top:24px;text-align:center">';
  html += '<div style="text-align:center;margin-top:16px"><button data-action="showChangeLog" class="btn-default" style="border-style:dashed">📝 变更日志 ('+_reservationLog.length+'条)</button></div>';
  html += '</div>';
  
  // ── Change log popup modal ──
  html += '<div id="changeLogModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center">';
  html += '<div style="background:#fff;border-radius:14px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-xl)">';

  html += '<button data-action="closeChangeLog" class="btn-default btn-sm">✕ 关闭</button>';
  html += '</div>';
  if (_reservationLog.length === 0) {
    html += '<div class="empty-state" style="padding:20px;color:var(--muted)">暂无变更记录</div>';
  } else {
    html += '<table class="data-table"><thead><tr><th>时间</th><th>操作人</th><th>店铺</th><th>产品</th><th>规格</th><th>旧→新</th></tr></thead><tbody>';
    _reservationLog.forEach(function(entry) {
      html += '<tr>';
      html += '<td style="font-size:10px;white-space:nowrap">' + entry.time + '</td>';

      html += '<td style="font-size:10px;color:var(--muted)">' + (entry.spec||'') + '</td>';
      html += '<td style="font-size:11px;font-family:monospace">' + (entry.oldQty||0) + ' → <span style="font-weight:600;color:' + (entry.newQty>entry.oldQty?'var(--green)':'var(--red)') + '">' + (entry.newQty||0) + '</span></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div></div>';
  
  html += '</div>';  // close sub-inventory

  document.getElementById('main').innerHTML = html;
  } catch(e) {
    document.getElementById('main').innerHTML = '<div class="view-switch">'
    + '<button class="vs-btn active" data-view="store">🏪 单店视图</button>'
    + '<button class="vs-btn" data-view="global">📊 全局视图</button>'
    + '</div>'
    + '<div class="empty-state" style="color:var(--red)">⚠️ 渲染出错<br><span style="font-size:18px;font-weight:700">'+e.message+'</span><br><small style="font-size:11px;color:var(--muted)">'+e.stack.toString().replace(/\n/g,'<br>')+'</small></div>';
    console.error('renderStore error:', e);

function switchPeriod(p){
  currentPeriod = p;
  renderStore(currentStore);
}

function toggleSubTab(el,id){
  currentSubTab = id;
  try { sessionStorage.setItem('hermes_co_tab', id); } catch(e) {}
  document.querySelectorAll('.sub-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  var ids = ['orders','ranking','status','refund','trends','inventory','realtime'];
  ids.forEach(function(sid){
    var el2 = document.getElementById('sub-'+sid);
    if (el2) el2.style.display = sid===id?'block':'none';
  });
  if (id === 'inventory' && (!INVENTORY || !INVENTORY.products)) {
    loadInventory(currentStore);
  }
  setTimeout(function(){ renderRealtime(); }, 10);
}

// Event delegation: sub-tabs, date-tabs, and store sidebar (manually walk up DOM for max compatibility)
document.addEventListener('click', function(e){
  var el = e.target;
  while (el) {
    // Skip non-element nodes (text nodes, etc.) which don't have classList
    if (el.nodeType === 1) {
      if (el.dataset.sub && el.classList.contains('sub-tab')) {
        toggleSubTab(el, el.dataset.sub);
        return;
      }
      if (el.dataset.period && el.classList.contains('date-tab')) {
        switchPeriod(el.dataset.period);
        return;
      }
      if (el.dataset.pid && el.classList.contains('shop')) {
        selectStore(el.dataset.pid);
        return;
      }
      if (el.dataset.invPage) {
        if (el.dataset.invPage === 'prev') _invPage = Math.max(1, _invPage-1);
        else _invPage = Math.min(_invTotalPages, _invPage+1);
        try { sessionStorage.setItem('hermes_co_invpage', _invPage); } catch(e) {}
        var _savedPage = _invPage;
        renderStore(currentStore);
        _invPage = _savedPage;
        return;
      }
      if (el.dataset.af) {
        filterAlloc(el.dataset.af);
        return;
      }
      if (el.dataset.zeros) {
        toggleZeroStock(el);
        return;
      }
      if (el.dataset.sort) {
        toggleOccRateSort();
        return;
      }
      if (el.dataset.view) {
        switchView(el.dataset.view);
        return;
      }
      if (el.dataset.globalPage) {
        globalGoPage(parseInt(el.dataset.globalPage));
        return;
      }
      if (el.dataset.action) {
        if (el.dataset.action === 'showExportPicker') { showExportPicker(); return; }
        if (el.dataset.action === 'exportJSON') { exportReservationsJSON(); return; }
        if (el.dataset.action === 'exportCSV') { exportReservationsCSV(); return; }
        if (el.dataset.action === 'importRes') { importReservations(); return; }
        if (el.dataset.action === 'closeAssign') { closeAssignModal(); return; }
        if (el.dataset.action === 'saveAssign') { saveReservation(); return; }
        if (el.dataset.action === 'showChangeLog') { showChangeLogPopup(); return; }
        if (el.dataset.action === 'closeChangeLog') { closeChangeLogPopup(); return; }
      }
      if (el.dataset.orderFilter) {
        _orderStatusFilter = el.dataset.orderFilter;
        renderStore(currentStore);
        return;
      }
      if (el.dataset.rf) {
        if (el.dataset.rf === 'single') { toggleSingleFilter(el); return; }
        if (el.classList.contains('rf-pill')) {
          filterRefundCards(el.dataset.rf);
        } else {
          filterRefund(el, el.dataset.rf);
        }
        return;
      }
      if (el.dataset.cell) {
        var parts = el.dataset.cell.split('|');
        var cellSpecKey = parts.slice(0, -1).join('|');
        var cellPid = parts[parts.length - 1];
        var cellRes = RESERVATIONS && RESERVATIONS[cellSpecKey];
        var currentQty = (cellRes && cellRes.stores && cellRes.stores[cellPid]) ? cellRes.stores[cellPid] : 0;
        var prodName = cellRes ? cellRes.product : cellSpecKey.split('||')[0];
        var specName = cellRes ? cellRes.spec : cellSpecKey.split('||').slice(1).join('||');
        var realQty = 999999;
        if (INVENTORY && INVENTORY.products_map && INVENTORY.products_map[prodName]) {
          var im = INVENTORY.products_map[prodName];
          (im.specs || []).forEach(function(s) {
            if (s.spec === specName) realQty = s.qty || 0;
          });
        }
        openAssignModal(prodName, specName, cellPid, realQty, currentQty);
        return;
      }
      // Inventory table buttons via data attributes
      if (el.dataset.remove) { removeReservation(el.dataset.remove, el.dataset.rmpid); return; }
      if (el.dataset.wh) { filterWarehouse(el, el.dataset.wh); return; }
      if (el.dataset.assign) {
        var aparts = el.dataset.assign.split('||');
        var aprod = aparts[0], aspec = aparts.slice(1).join('||');
        openAssignModal(aprod, aspec, el.dataset.apid, parseInt(el.dataset.aqty)||0, parseInt(el.dataset.asres)||0);
        return;
      }
      if (el.dataset.batch) { batchClaimAll(el.dataset.batch, el.dataset.bpid); return; }
    }
    el = el.parentElement;
  }
});

// ── Inventory management functions ──
var _assignPid = null, _assignProduct = null, _assignSpec = null, _assignTotal = 0;

var _currentWarehouse = 'all';
var _showZeroStock = false;
var _allocFilter = 'all';
var _occRateSort = null;
var _invPage = 1;
try {
  var savedInvPage = sessionStorage.getItem('hermes_co_invpage');
  if (savedInvPage) _invPage = parseInt(savedInvPage) || 1;
} catch(e) {}
var _invTotalPages = 1;

function toggleZeroStock(btn) {
  _showZeroStock = !_showZeroStock;
  if (_showZeroStock) {
    document.querySelectorAll('.inv-warehouse-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.inv-zero-btn').forEach(function(b){b.classList.add('active'); b.style.background='var(--red)'; b.style.color='#fff';});
  } else {
    document.querySelectorAll('.inv-zero-btn').forEach(function(b){b.classList.remove('active'); b.style.background='var(--card-bg)'; b.style.color='var(--red)';});

function filterAlloc(af) {
  _allocFilter = af;
  _showZeroStock = false;
  document.querySelectorAll('.inv-zero-btn').forEach(function(b){b.classList.remove('active'); b.style.background='var(--card-bg)'; b.style.color='var(--red)';});
  document.querySelectorAll('.inv-alloc-btn').forEach(function(b){b.classList.remove('active')});

function toggleOccRateSort() {
  _occRateSort = _occRateSort === 'asc' ? 'desc' : _occRateSort === 'desc' ? null : 'asc';
  _invPage = 1;
  renderStore(currentStore);
}
function getOccRateColor(reserved, total) {
  if (total <= 0) return 'var(--dim)';
  var rate = reserved / total;
  if (rate > 0.8) return 'var(--red)';
  if (rate > 0.5) return 'var(--yellow)';
  return 'var(--green)';
}

function filterWarehouse(btn, wh) {
  _showZeroStock = false;
  _currentWarehouse = wh;
  document.querySelectorAll('.inv-warehouse-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.inv-zero-btn').forEach(function(b){b.classList.remove('active'); b.style.background='var(--card-bg)'; b.style.color='var(--red)';});
  btn.classList.add('active');
  _invPage = 1;
  renderStore(currentStore);
}

function filterInventory() {
  var q = (document.getElementById('invSearch')||{}).value || '';
  q = q.toLowerCase();
  var rows = document.querySelectorAll('.inv-row');
  rows.forEach(function(r) {
    var title = (r.dataset.title || '').toLowerCase();
    var spec = (r.dataset.spec || '').toLowerCase();
    var code = (r.dataset.code || '').toLowerCase();
    var subcode = (r.dataset.subcode || '').toLowerCase();
    var wh = r.dataset.wh || '';
    var textMatch = !q || title.indexOf(q) >= 0 || spec.indexOf(q) >= 0 || code.indexOf(q) >= 0 || subcode.indexOf(q) >= 0;
    var whMatch = _currentWarehouse === 'all' || wh === _currentWarehouse;
    r.style.display = (textMatch && whMatch) ? '' : 'none';
  });
}

function openAssignModal(product, spec, pid, total, current) {
  _assignProduct = product;
  _assignSpec = spec;
  document.getElementById('assignSpec').textContent = '规格: ' + spec;
  _assignPid = pid;
  _assignTotal = total;
  
  document.getElementById('assignProduct').textContent = product + ' · ' + spec;
  document.getElementById('assignStore').textContent = STORE_DATA[pid] ? STORE_DATA[pid].name : pid;
  document.getElementById('assignTotal').textContent = total;
  
  // Calculate shared
  var reservedTotal = 0;
  var res = RESERVATIONS && RESERVATIONS[product] ? RESERVATIONS[product] : null;
  if (res && res.stores) {
    for (var sp in res.stores) {
      if (sp !== pid) reservedTotal += res.stores[sp];
    }
  }
  var shared = Math.max(0, total - reservedTotal - current);
  document.getElementById('assignShared').textContent = shared + current;
  
  document.getElementById('assignQty').value = current;
  document.getElementById('assignModal').style.display = 'flex';
}

var _inventoryLoading = false;


function renderRealtime() {
  var el = document.getElementById('sub-realtime');
  if (!el || currentSubTab !== 'realtime') return;
  
  var _rtPeriod = 'today';
  
  var allStoreData = STORE_DATA || {};
  var storeList = [];
  for (var sid in allStoreData) {
    var sd = allStoreData[sid];
    if (!sd || !sd.orders) continue;
    storeList.push({id: sid, name: sd.name || sid, orders: sd.orders, total: sd.total || 0});
  }
  if (!storeList.length) { el.innerHTML = '<div class="empty-state">暂无数据</div>'; el.dataset.rendered='1'; return; }
  
  var filterMode = 'all';
  var selectedStores = {};
  storeList.forEach(function(s){ selectedStores[s.id] = true; });
  
  function getOrders() {
    var out = [];
    storeList.forEach(function(s) {
      var ok = filterMode === 'all' || (filterMode === 'include' && selectedStores[s.id]) || (filterMode === 'exclude' && !selectedStores[s.id]);
      if (ok) (s.orders||[]).forEach(function(o){ out.push({store:s.name, sid:s.id, order:o}); });
    });
    // Time filter
    var range = getDateRange(_rtPeriod);
    out = out.filter(function(ro){
      var t = ro.order.createTime || '';
      if (!t) return true;
      try { var ts = new Date(t.replace(' ','T')).getTime(); return ts >= range.start.getTime() && ts < range.end.getTime(); } catch(e) { return true; }
    });
    return out;
  }
  
  function agg() {
    var oo = getOrders(), rev=0, it=0, st={};
    oo.forEach(function(o){
      (o.order.shopOrderGoods||[]).forEach(function(g){
        rev += (g.modelDiscountedPrice||0)*(g.modelQuantityPurchased||1);
        it += g.modelQuantityPurchased||1;
      });
      st[o.sid] = 1;
    });
    return {n:oo.length, rev:rev, it:it, sc:Object.keys(st).length, avg:oo.length?Math.round(rev/oo.length):0};
  }
  
  function build() {
    var a = agg(), h = '';
    // Date tabs
    h += '<div class="date-tabs" style="margin-bottom:16px">';
    var periods = {today:'今天',yesterday:'昨天','7days':'7天','30days':'30天',all:'全部'};
    for (var pk in periods) {
      h += '<span class="date-tab' + (_rtPeriod===pk?' active':'') + '" onclick="window._rtp(\''+pk+'\')">'+periods[pk]+'</span>';
    }
    h += '</div>';
    
    h += '<div class="rt-kpi-grid">';
    h += '<div class="rt-kpi"><div class="rt-lbl">📦 订单数</div><div class="rt-val">'+a.n+'</div><div class="rt-sub">'+a.sc+' 家店</div></div>';
    h += '<div class="rt-kpi green"><div class="rt-lbl">💰 营收 (TWD)</div><div class="rt-val">$'+a.rev.toLocaleString()+'</div></div>';
    h += '<div class="rt-kpi purple"><div class="rt-lbl">📦 件数</div><div class="rt-val">'+a.it+'</div></div>';
    h += '<div class="rt-kpi yellow"><div class="rt-lbl">📊 客单价</div><div class="rt-val">$'+a.avg.toLocaleString()+'</div></div>';
    h += '</div>';
    
    h += '<div class="store-filter"><span class="sf-label">店铺：</span>';
    h += '<span class="sf-quick" onclick="window._ra()">全选</span><span class="sf-quick" onclick="window._rc()" style="color:var(--red);border-color:var(--red)">清空</span>';
    storeList.forEach(function(s){
      var cls = 'sf-pill';
      if (filterMode==='exclude' && selectedStores[s.id]) cls += ' excluded';
      else cls += ' selected';
      h += '<span class="'+cls+'" data-sid="'+s.id+'" onclick="window._rt('+s.id+')">'+s.name+'</span>';
    });
    h += '</div>';
    
    // Revenue chart (time-filtered)
    var revMap = {};
    getOrders().forEach(function(ro){
      revMap[ro.sid] = (revMap[ro.sid]||0) + (ro.order.shopOrderGoods||[]).reduce(function(s,g){return s+(g.modelDiscountedPrice||0)*(g.modelQuantityPurchased||1);},0);
    });
    var srev = storeList.map(function(s){return {name:s.name, rev:revMap[s.id]||0};});
    srev.sort(function(a,b){return b.rev-a.rev;});
    var mx = srev[0] ? (srev[0].rev || 1) : 1;
    h += '<div style="background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px">';
    h += '<div style="font-size:13px;font-weight:600;margin-bottom:12px">📊 各店营收</div>';
    srev.forEach(function(r){
      var p = mx>0?Math.round(r.rev/mx*100):0;
      h += '<div class="rt-chart-bar"><div class="rt-bar-name">'+r.name+'</div><div class="rt-bar-track"><div class="rt-bar-fill" style="width:'+p+'%"></div></div><div class="rt-bar-val">$'+r.rev.toLocaleString()+'</div></div>';
    });
    h += '</div>';
    
    var all = getOrders();
    all.sort(function(a,b){return (b.order.createTime||'').localeCompare(a.order.createTime||'');});
    var rec = all.slice(0,30);
    h += '<div style="background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)">';
    h += '<div style="font-size:13px;font-weight:600;margin-bottom:12px">🕐 最近订单 ('+rec.length+'/'+all.length+')</div>';
    if (rec.length) {
      h += '<div style="overflow-x:auto"><table class="rt-orders-table"><thead><tr><th>店铺</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody>';
      rec.forEach(function(ro){
        var o=ro.order, gs=o.shopOrderGoods||[], g=gs[0]||{};
        var amt=gs.reduce(function(s,g2){return s+(g2.modelDiscountedPrice||0)*(g2.modelQuantityPurchased||1);},0);
        var st=o.orderStatus||'', lb=st==='READY_TO_SHIP'?'待发货':st==='SHIPPED'?'已发货':st==='COMPLETED'?'已完成':st==='CANCELLED'?'已取消':st;
        var cl=st==='CANCELLED'?'var(--red)':st==='READY_TO_SHIP'?'var(--orange)':'var(--green)';
        var tm=(o.createTime||'').substring(11,16);
        h += '<tr><td>'+ro.store+'</td><td>'+((g.itemName||g.modelName||'?').substring(0,40))+'</td><td>'+gs.reduce(function(s,g3){return s+(g3.modelQuantityPurchased||1);},0)+'</td><td>$'+amt.toLocaleString()+'</td><td style="color:'+cl+'">'+lb+'</td><td>'+tm+'</td></tr>';
      });
      h += '</tbody></table></div>';
    } else { h += '<div class="empty-state">暂无订单</div>'; }
    h += '</div>';
    el.innerHTML = h; el.dataset.rendered = '1';
  }
  
  window._rt = function(id) {
    if (filterMode==='all') { filterMode='include'; storeList.forEach(function(s){selectedStores[s.id]=false;}); selectedStores[id]=true; }
    else { selectedStores[id]=!selectedStores[id]; }
    el.dataset.rendered=''; build();
  };
  window._ra = function(){ filterMode='all'; storeList.forEach(function(s){selectedStores[s.id]=true;}); el.dataset.rendered=''; build(); };
  window._rc = function(){ filterMode='include'; storeList.forEach(function(s){selectedStores[s.id]=false;}); el.dataset.rendered=''; build(); };

}

function importReservations() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,.csv';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        if (ext === 'csv') {
          importReservationsFromCSV(ev.target.result);
        } else {
          var data = JSON.parse(ev.target.result);
          var count = 0;
          for (var k in data) { if (k !== '_note') { RESERVATIONS[k] = data[k]; count++; } }
          try { localStorage.setItem('hermes_co_reservations', JSON.stringify(RESERVATIONS)); } catch(ex) {}
          saveReservationsToGitHub();
          renderStore(currentStore);
          alert('✅ 导入成功！共 ' + count + ' 条保留配置（JSON）');
        }
      } catch(err) {
        alert('❌ 导入失败：文件格式错误 - ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function importReservationsFromCSV(csvText) {
  var lines = csvText.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) throw new Error('CSV 至少需要表头和数据行');
  // Remove BOM if present
  if (lines[0].charCodeAt(0) === 0xFEFF) lines[0] = lines[0].slice(1);
  var headers = parseCSVLine(lines[0]);
  // Build store name → store ID mapping
  var nameToId = {};
  STORE_GROUPS.forEach(function(g) {
    g.shops.forEach(function(sp) {
      if (STORE_DATA[sp]) nameToId[STORE_DATA[sp].name] = sp;
    });
  });
  // Map header columns (index 2+) to store IDs
  var colStore = {}; // col index → store ID
  for (var i = 2; i < headers.length; i++) {
    var hname = (headers[i] || '').trim();
    if (nameToId[hname]) colStore[i] = nameToId[hname];
  }
  // Parse data rows
  var count = 0;
  for (var r = 1; r < lines.length; r++) {
    var cols = parseCSVLine(lines[r]);
    var product = (cols[0] || '').trim();
    var spec = (cols[1] || '').trim();
    if (!product || !spec) continue;
    var specKey = product + '||' + spec;
    if (!RESERVATIONS[specKey]) {
      RESERVATIONS[specKey] = {product: product, spec: spec, stores: {}};
    }
    for (var ci in colStore) {
      var qty = parseInt(cols[ci]) || 0;
      if (qty > 0) {
        RESERVATIONS[specKey].stores[colStore[ci]] = qty;
      }
    }
    count++;
  }
  try { localStorage.setItem('hermes_co_reservations', JSON.stringify(RESERVATIONS)); } catch(ex) {}
  saveReservationsToGitHub();
  renderStore(currentStore);
  alert('✅ 导入成功！共 ' + count + ' 条保留配置（CSV）');
}
function parseCSVLine(line) {
  var result = [];
  var current = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < line.length && line[i + 1] === '"') {
          current += '"'; i++;
        } else {
          inQuotes = false;
        }
      } else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

function saveReservation() {
  var qty = parseInt(document.getElementById('assignQty').value) || 0;
  
  var specKey = _assignProduct + '||' + _assignSpec;
  
  // ── 校验：该店保留 + 其他店保留之和 ≤ 总库存 ──
  var specQty = _assignTotal;  // 总库存（来自 openAssignModal）
  var otherReserved = 0;
  var existingRes = RESERVATIONS && RESERVATIONS[specKey] ? RESERVATIONS[specKey] : null;
  if (existingRes && existingRes.stores) {
    for (var sp in existingRes.stores) {
      if (sp !== _assignPid) otherReserved += existingRes.stores[sp];
    }
  }
  var maxAllowed = Math.max(0, specQty - otherReserved);
  if (qty > maxAllowed) {
    alert('⚠️ 超出可分配上限！\n\n总库存: ' + specQty + ' 件\n其他店已分配: ' + otherReserved + ' 件\n本店最多可分配: ' + maxAllowed + ' 件');
    return;
  }
  
  if (!RESERVATIONS) RESERVATIONS = {};
  if (!RESERVATIONS[specKey]) {
    RESERVATIONS[specKey] = {product: _assignProduct, spec: _assignSpec, stores: {}};
  }
  
  var oldQty = (RESERVATIONS[specKey].stores && RESERVATIONS[specKey].stores[_assignPid]) || 0;
  
  if (qty <= 0) {
    delete RESERVATIONS[specKey].stores[_assignPid];
    if (Object.keys(RESERVATIONS[specKey].stores).length === 0) {
      delete RESERVATIONS[specKey];
    }
  } else {
    RESERVATIONS[specKey].stores[_assignPid] = qty;
  }
  
  // Save to localStorage (cache) + GitHub (persistence)
  try {
    localStorage.setItem('hermes_co_reservations', JSON.stringify(RESERVATIONS));
  } catch(e) {}
  saveReservationsToGitHub();
  logReservationChange(_assignPid, _assignProduct, _assignSpec, oldQty, qty);
  
  closeAssignModal();
  if (_currentView === 'global') {
    renderGlobalView();
  } else {
    renderStore(currentStore);
  }
}

function batchClaimAll(product, pid) {
  if (!INVENTORY || !INVENTORY.products) return;
  if (!RESERVATIONS) RESERVATIONS = {};
  
  // ── 先计算将要认领的规格和数量 ──
  var plan = [];
  var totalClaimed = 0;
  INVENTORY.products.forEach(function(p) {
    if (p.title !== product) return;
    (p.specs || []).forEach(function(s) {
      var specKey = p.title + '||' + s.spec;
      var specQty = s.qty || 0;
      var res = RESERVATIONS[specKey];
      var reservedTotal = 0;
      if (res && res.stores) {
        for (var sp in res.stores) { reservedTotal += res.stores[sp]; }
      }
      var shared = Math.max(0, specQty - reservedTotal);
      if (shared > 0) {
        plan.push({spec: s.spec, qty: shared});
        totalClaimed += shared;
      }
    });
  });
  
  if (plan.length === 0) { alert('该产品无可售库存'); return; }
  
  // ── 二次确认 ──
  var storeName = STORE_DATA[pid] ? STORE_DATA[pid].name : pid;
  var msg = '📦 整批认领确认\n\n';
  msg += '店铺: ' + storeName + '\n';
  msg += '产品: ' + product.substring(0, 40) + '\n';
  msg += '规格数: ' + plan.length + ' 个\n';
  msg += '总件数: ' + totalClaimed + ' 件\n\n';
  msg += '⚠️ 认领后其他店铺对此产品的可售库存将变为 0！\n\n';
  msg += '确定执行？';
  if (!confirm(msg)) return;
  
  // ── 执行认领 ──
  plan.forEach(function(item) {
    var specKey = product + '||' + item.spec;
    if (!RESERVATIONS[specKey]) {
      RESERVATIONS[specKey] = {product: product, spec: item.spec, stores: {}};
    }
    RESERVATIONS[specKey].stores[pid] = item.qty;
  });
  
  try {
    localStorage.setItem('hermes_co_reservations', JSON.stringify(RESERVATIONS));
  } catch(e) {}
  saveReservationsToGitHub();
  
  renderStore(currentStore);
}

function removeReservation(specKey, pid) {
  if (!RESERVATIONS || !RESERVATIONS[specKey]) return;
  var oldQty = (RESERVATIONS[specKey].stores && RESERVATIONS[specKey].stores[pid]) || 0;
  var product = RESERVATIONS[specKey].product || specKey.split('||')[0];
  var spec = RESERVATIONS[specKey].spec || specKey.split('||').slice(1).join('||');
  delete RESERVATIONS[specKey].stores[pid];
  if (Object.keys(RESERVATIONS[specKey].stores).length === 0) {
    delete RESERVATIONS[specKey];
  }
  logReservationChange(pid, product, spec, oldQty, 0);
  try {
    localStorage.setItem('hermes_co_reservations', JSON.stringify(RESERVATIONS));
  } catch(e) {}
  saveReservationsToGitHub();
  renderStore(currentStore);
}

function renderGlobalView() {

  } else if (filtered.length === 0) {

  main.innerHTML = html;
  } catch(e) {

    for (var k in parsed) {
      if (!RESERVATIONS) RESERVATIONS = {};
      RESERVATIONS[k] = parsed[k];
    }
  }
} catch(e) {}

// Init: render immediately, then sync reservations asynchronously
// Restore tab + store state from session (survives refresh)
try {
  var savedTab = sessionStorage.getItem('hermes_co_tab');
  if (savedTab) currentSubTab = savedTab;
} catch(e) {}
if (!currentSubTab) currentSubTab = 'orders';
buildSidebar();
var firstPid = null;
STORE_GROUPS.forEach(function(g){
  g.shops.forEach(function(pid){
    if(!firstPid && STORE_DATA[pid]) firstPid = pid;
  });
});
// Restore last-selected store, fall back to first store
var startPid = null;
try { startPid = sessionStorage.getItem('hermes_co_store'); } catch(e) {}
if (!startPid || !STORE_DATA[startPid]) startPid = firstPid;
// Restore view mode (realtime or store)
var savedView = null;
try { savedView = sessionStorage.getItem('hermes_co_view'); } catch(e) {}
if (savedView === 'realtime' && typeof showRealtime === 'function') {
  setTimeout(function(){ showRealtime(); }, 50);
} else if(startPid) {
  selectStore(startPid);
}

// Sync reservations from GitHub in background (doesn't block rendering)
loadReservationsFromGitHub();
loadChangeLogFromGitHub();

// ── Mobile detection (JS-driven, more reliable than @media in Feishu) ──
(function() {
  function setMobile() {
    if (window.innerWidth <= 768) {
      document.body.classList.add('mobile');
    } else {
      document.body.classList.remove('mobile');
    }
  }
  setMobile();
  window.addEventListener('resize', setMobile);
})();
// Auto-refresh every 15 minutes
setInterval(function(){ location.reload(); }, 15*60*1000);
</script>
</body>
