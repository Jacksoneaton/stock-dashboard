<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>⚡ 公司看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f6fa;--card-bg:#fff;--border:rgba(0,0,0,.08);
  --text:#1a1c2e;--muted:#6b7280;--dim:#d1d5db;
  --cyan:#6366f1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--purple:#7c3aed;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08);--shadow-xl:0 8px 24px rgba(0,0,0,.1);
  --radius-sm:6px;--radius:12px;--radius-lg:14px;--radius-full:20px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#eef0f6 0%,#f5f6fa 30%);color:var(--text);display:flex;min-height:100vh}

/* ═══ 侧边栏 ═══ */
.sidebar{width:100%;max-width:220px;background:var(--card-bg);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;box-shadow:2px 0 16px rgba(0,0,0,.06);position:relative;z-index:2;overflow-y:auto}
.sidebar .brand{font-size:15px;font-weight:700;padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:12px;color:var(--text);background:linear-gradient(135deg,rgba(99,102,241,.04),transparent)}
.sidebar .brand span{color:var(--cyan)}
.sidebar .section{font-size:10px;color:var(--muted);padding:12px 20px 4px;text-transform:uppercase;letter-spacing:.6px}
.store-tab{display:flex;align-items:center;gap:8px;padding:9px 20px;font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;position:relative;border-left:3px solid transparent;text-decoration:none}
.store-tab:hover{background:rgba(99,102,241,.04);color:var(--text)}
.store-tab.active{background:rgba(99,102,241,.06);color:var(--cyan);font-weight:600;border-left-color:var(--cyan)}
.store-tab .badge{font-size:10px;background:rgba(99,102,241,.1);color:var(--cyan);padding:1px 6px;border-radius:8px;font-weight:600;min-width:22px;text-align:center}

/* ═══ 主内容区 ═══ */
.main{flex:1;min-width:0;padding:24px 32px;overflow-y:auto}
.store-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.store-header h1{font-size:20px;font-weight:700;color:var(--text)}
.store-header .store-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
.store-status.synced{background:rgba(34,197,94,.08);color:var(--green)}
.store-status.empty{background:rgba(107,114,128,.08);color:var(--muted)}

/* ═══ KPI 卡片 ═══ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card-bg);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);transition:.2s;border:1px solid var(--border)}
.kpi-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.kpi-card .kpi-label{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.kpi-card .kpi-value{font-size:26px;font-weight:700;font-family:'SF Mono',monospace}
.kpi-card .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px}
.kpi-value.blue{color:var(--cyan)}
.kpi-value.green{color:var(--green)}
.kpi-value.red{color:var(--red)}
.kpi-value.purple{color:var(--purple)}

/* ═══ 订单表格 ═══ */
.section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .count{font-size:11px;color:var(--muted);font-weight:400}
.order-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);font-size:12px}
.order-table th{background:rgba(99,102,241,.04);color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.order-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.order-table tr:hover td{background:rgba(99,102,241,.02)}
.order-table .item-name{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.status-badge.shipping{background:rgba(245,158,11,.1);color:var(--yellow)}
.status-badge.completed{background:rgba(34,197,94,.1);color:var(--green)}
.status-badge.cancelled{background:rgba(239,68,68,.1);color:var(--red)}
.status-badge.processing{background:rgba(99,102,241,.1);color:var(--cyan)}

/* ═══ 空状态 ═══ */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state p{font-size:14px}

/* ═══ 数据概览行 ═══ */
.overview-bar{display:flex;gap:12px;margin-bottom:16px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.overview-item{display:flex;align-items:center;gap:4px;background:var(--card-bg);padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border)}

/* ═══ 手机端 ═══ */
@media(max-width:768px){
  body{display:block}
  .sidebar{width:100%;max-width:none;display:flex;flex-direction:row;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);-webkit-overflow-scrolling:touch;gap:2px;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
  .sidebar::-webkit-scrollbar{height:0}
  .sidebar .brand{display:none}
  .sidebar .section{display:none}
  .store-tab{flex-shrink:0;min-width:44px;padding:6px 8px;min-height:44px;font-size:11px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;border-radius:var(--radius);text-align:center}
  .store-tab.active{border-left:none;border-bottom-color:var(--cyan);background:transparent}
  .main{padding:12px 10px}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi-card{padding:12px 10px}
  .kpi-card .kpi-value{font-size:20px}
  .order-table{font-size:10px}
  .order-table .item-name{max-width:120px}
}
</style>
</head>

// ═══ 渲染函数 ═══
function renderStore(storeId) {
  var data = STORE_DATA[storeId];
  var main = document.getElementById('store-content');
  
  if (!data) {
    main.innerHTML = '<div class="empty-state"><div class="icon">🏪</div><p>店铺数据未加载</p></div>';
    return;
  }
  
  var orders = data.orders || [];
  var skus = {};
  var totalAmount = 0;
  
  orders.forEach(function(o) {
    (o.shopOrderGoods || []).forEach(function(g) {
      var sku = g.modelSku || g.modelName || 'unknown';
      skus[sku] = (skus[sku] || 0) + (g.modelQuantityPurchased || 1);
      totalAmount += (g.modelDiscountedPrice || 0) * (g.modelQuantityPurchased || 1);
    });
  });
  
  var uniqueSkus = Object.keys(skus).length;
  var statusCounts = {};
  orders.forEach(function(o) {
    var s = o.orderStatus || 'UNKNOWN';
    statusCounts[s] = (statusCounts[s] || 0) + 1;
  });
  
  var recentOrders = orders.slice(0, 20);
  var statusLabel = data.total > 0 ? 'synced' : 'empty';
  var statusText = data.total > 0 ? '已同步' : '数据为空';
  
  var html = '';
  
  // Header
  html += '<div class="store-header">';
  html += '<h1>' + (data.name || '未命名店铺') + '</h1>';
  html += '<span class="store-status ' + statusLabel + '">' + statusText + '</span>';
  html += '</div>';
  
  // Overview bar
  html += '<div class="overview-bar">';
  html += '<div class="overview-item">📦 总订单: <b>' + (data.total || 0) + '</b></div>';
  html += '<div class="overview-item">🏷️ SKU数: <b>' + uniqueSkus + '</b></div>';
  html += '<div class="overview-item">💰 总金额: <b>NT$' + totalAmount.toLocaleString() + '</b></div>';
  html += '<div class="overview-item">📋 已拉取: <b>' + orders.length + ' 条</b></div>';
  html += '</div>';
  
  // KPI cards
  html += '<div class="kpi-row">';
  html += '<div class="kpi-card"><div class="kpi-label">总订单数</div><div class="kpi-value blue">' + (data.total || 0) + '</div><div class="kpi-sub">全部状态</div></div>';
  
  var readyToShip = statusCounts['READY_TO_SHIP'] || 0;
  html += '<div class="kpi-card"><div class="kpi-label">待发货</div><div class="kpi-value ' + (readyToShip > 0 ? 'red' : '') + '">' + readyToShip + '</div><div class="kpi-sub">READY_TO_SHIP</div></div>';
  
  var completed = statusCounts['COMPLETED'] || 0;
  html += '<div class="kpi-card"><div class="kpi-label">已完成</div><div class="kpi-value green">' + completed + '</div><div class="kpi-sub">COMPLETED</div></div>';
  
  html += '<div class="kpi-card"><div class="kpi-label">独立 SKU</div><div class="kpi-value purple">' + uniqueSkus + '</div><div class="kpi-sub">去重后</div></div>';
  html += '</div>';
  
  // Order table
  if (recentOrders.length > 0) {
    html += '<div class="section-title">📋 最近订单 <span class="count">(' + recentOrders.length + ' / ' + orders.length + ')</span></div>';
    html += '<table class="order-table"><thead><tr>';
    html += '<th>订单号</th><th>商品</th><th>规格</th><th>数量</th><th>金额</th><th>状态</th><th>时间</th>';
    html += '</tr></thead><tbody>';
    
    recentOrders.forEach(function(o) {
      var goods = o.shopOrderGoods || [];
      var itemsHtml = goods.slice(0, 2).map(function(g) {
        return '<div class="item-name" title="' + (g.itemName || '') + '">' + (g.itemName || '—') + '</div>';
      }).join('');
      var specsHtml = goods.slice(0, 2).map(function(g) {
        return '<div>' + (g.modelName || '—') + '</div>';
      }).join('');
      var qty = goods.reduce(function(s, g) { return s + (g.modelQuantityPurchased || 0); }, 0);
      var amt = goods.reduce(function(s, g) { return s + (g.modelDiscountedPrice || 0) * (g.modelQuantityPurchased || 0); }, 0);
      var status = o.orderStatus || 'UNKNOWN';
      var statusClass = status === 'READY_TO_SHIP' ? 'shipping' : status === 'COMPLETED' ? 'completed' : status === 'CANCELLED' ? 'cancelled' : 'processing';
      var time = (o.createTime || '').slice(0, 16);
      
      html += '<tr>';
      html += '<td style="font-family:monospace;font-size:10px">' + (o.orderSn || '—') + '</td>';
      html += '<td>' + (itemsHtml || '—') + '</td>';
      html += '<td style="font-size:11px">' + (specsHtml || '—') + '</td>';
      html += '<td>' + qty + '</td>';
      html += '<td>NT$' + amt + '</td>';
      html += '<td><span class="status-badge ' + statusClass + '">' + status + '</span></td>';
      html += '<td style="font-size:10px;color:var(--muted)">' + time + '</td>';
      html += '</tr>';
    });
    
    html += '</tbody></table>';
  } else {
    html += '<div class="empty-state"><div class="icon">📭</div><p>暂无从货憨憨拉取的订单数据</p><p style="font-size:12px;margin-top:4px">数据将在接入后自动显示</p></div>';
  }
  
  main.innerHTML = html;
}

// ═══ 侧边栏切换 ═══
document.querySelectorAll('.store-tab').forEach(function(tab) {
  tab.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.store-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    
    var storeId = this.getAttribute('data-store');
    if (this.classList.contains('empty-store')) {
      document.getElementById('store-content').innerHTML = '<div class="empty-state"><div class="icon">⏸️</div><p>' + this.textContent.replace(/\d+/g,'').trim() + '</p><p style="font-size:12px;margin-top:4px">暂未接入，数据为空</p></div>';
    } else {
      renderStore(storeId);
    }
  });
});
