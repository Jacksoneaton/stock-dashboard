<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏢 公司看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eef0f6;--card-bg:#fff;--border:rgba(0,0,0,.08);
  --text:#1a1c2e;--muted:#6b7280;--dim:#d1d5db;
  --cyan:#6366f1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--purple:#7c3aed;
  --radius-sm:6px;--radius:12px;--radius-lg:14px;--radius-full:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08);--shadow-xl:0 8px 32px rgba(0,0,0,.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#eef0f6 0%,#f5f6fa 30%);color:var(--text);display:flex;min-height:100vh}
img,svg{max-width:100%;height:auto}

/* ═══ 侧边栏 ═══ */
.sidebar{width:100%;max-width:220px;background:var(--card-bg);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;box-shadow:2px 0 16px rgba(0,0,0,.06);z-index:2;overflow-y:auto;display:flex;flex-direction:column}
.sidebar .brand{font-size:16px;font-weight:700;padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:8px;color:var(--text);background:linear-gradient(135deg,rgba(99,102,241,.04),transparent)}
.sidebar .brand span{color:var(--cyan)}
.sidebar .section{font-size:10px;color:var(--muted);padding:14px 20px 4px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.sidebar .shop-item{display:flex;align-items:center;gap:8px;padding:9px 20px;font-size:13px;color:var(--text);cursor:pointer;transition:.15s;border-left:3px solid transparent;text-decoration:none}
.sidebar .shop-item:hover{background:rgba(99,102,241,.04)}
.sidebar .shop-item.active{background:rgba(99,102,241,.08);border-left-color:var(--cyan);font-weight:600;color:var(--cyan)}
.sidebar .shop-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--dim)}
.sidebar .shop-item.active .shop-dot{background:var(--cyan)}

/* ═══ 主内容 ═══ */
.main{flex:1;min-width:0;padding:24px 28px 40px;overflow-y:auto}
.main h1{font-size:22px;font-weight:700;margin-bottom:4px}
.main .shop-subtitle{font-size:12px;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shop-subtitle .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(99,102,241,.1);color:var(--cyan)}

/* ═══ 汇总栏 ═══ */
.summary-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center;font-size:12px;color:var(--muted);background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px;box-shadow:var(--shadow-sm)}
.summary-bar strong{color:var(--text)}
.summary-sep{width:1px;height:14px;background:var(--border);margin:0 6px}

/* ═══ KPI 卡片 ═══ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);transition:all .2s;position:relative;overflow:hidden}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi-card .kpi-num{font-size:28px;font-weight:700;font-family:'JetBrains Mono','SF Mono',monospace;margin-bottom:2px}
.kpi-card .kpi-lbl{font-size:11px;color:var(--muted)}
.kpi-card .kpi-sub{font-size:10px;color:var(--dim);margin-top:2px}
.kpi-card.blue{border-top:3px solid var(--cyan)} .kpi-card.blue .kpi-num{color:var(--cyan)}
.kpi-card.red{border-top:3px solid var(--red)} .kpi-card.red .kpi-num{color:var(--red)}
.kpi-card.yellow{border-top:3px solid var(--yellow)} .kpi-card.yellow .kpi-num{color:var(--yellow)}
.kpi-card.green{border-top:3px solid var(--green)} .kpi-card.green .kpi-num{color:var(--green)}
.kpi-card.purple{border-top:3px solid var(--purple)} .kpi-card.purple .kpi-num{color:var(--purple)}

/* ═══ 子标签 ═══ */
.sub-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin-bottom:20px;background:var(--card-bg);border-radius:var(--radius);padding:4px;border:1px solid var(--border);width:fit-content}
.sub-tab{flex-shrink:0;padding:7px 16px;font-size:12px;border-radius:var(--radius-sm);cursor:pointer;transition:.15s;white-space:nowrap;border:none;background:transparent;color:var(--muted);font-weight:500}
.sub-tab:hover{background:rgba(99,102,241,.04)}
.sub-tab.active{background:var(--cyan);color:#fff;font-weight:600}

/* ═══ 数据区域 ═══ */
.data-panel{display:none}
.data-panel.active{display:block}

/* 表格 */
.data-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.data-table th{background:rgba(99,102,241,.04);color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:rgba(99,102,241,.02)}

/* 占位 */
.empty-state{background:var(--card-bg);border:1px dashed var(--border);border-radius:var(--radius);padding:48px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow-sm)}
.empty-state .empty-icon{font-size:36px;margin-bottom:10px;opacity:.5}
.empty-state .empty-text{font-size:13px;line-height:1.6}
.empty-state .empty-hint{font-size:11px;color:var(--dim);margin-top:4px}

/* 卡片网格（仿库存看板） */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.info-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.info-card .info-title{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text)}
.info-card .info-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(0,0,0,.03)}
.info-card .info-row:last-child{border-bottom:none}
.info-card .info-label{color:var(--muted)}
.info-card .info-value{font-weight:500;font-family:'JetBrains Mono','SF Mono',monospace}

/* 状态标签 */
.status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.status-tag.green{background:rgba(34,197,94,.1);color:var(--green)}
.status-tag.yellow{background:rgba(245,158,11,.1);color:var(--yellow)}
.status-tag.red{background:rgba(239,68,68,.1);color:var(--red)}
.status-tag.blue{background:rgba(99,102,241,.1);color:var(--cyan)}

/* 同步状态条 */
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--muted);margin-bottom:16px;box-shadow:var(--shadow-sm)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.green{background:var(--green);animation:pulse-dot 2s infinite}
.sync-dot.yellow{background:var(--yellow)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══ 手机端 ═══ */
@media(max-width:768px){
  body{display:block}
  .sidebar{width:100%;max-width:none;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);-webkit-overflow-scrolling:touch;gap:2px}
  .sidebar::-webkit-scrollbar{height:0}
  .sidebar .brand{display:none}
  .sidebar .section{display:none}
  .shop-item{flex-shrink:0;min-width:44px;padding:8px 10px;font-size:11px;border-left:none;border-bottom:2px solid transparent;border-radius:var(--radius)}
  .shop-item.active{border-left:none;border-bottom:2px solid var(--cyan);background:transparent}
  .shop-dot{display:none}
  .main{padding:12px 10px}
  .main h1{font-size:17px}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi-card{padding:12px 14px}
  .kpi-card .kpi-num{font-size:22px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="brand"><span>🏢</span> 公司看板</div>
</nav>

<main class="main" id="mainContent">
  <div id="welcomeView">
    <h1>🏢 公司看板</h1>
    <p class="shop-subtitle">← 选择店铺查看详情</p>
    <div class="empty-state" style="margin-top:40px">
      <div class="empty-icon">📊</div>
      <div class="empty-text">共 15 家店铺</div>
      <div class="empty-hint">从左侧选择店铺，查看该店的订单、库存、销售数据</div>
    </div>
  </div>
  
  <div id="shopView" style="display:none">
    <h1 id="shopTitle">🏪</h1>
    <p class="shop-subtitle" id="shopMeta"></p>
    
    <!-- 同步状态 -->
    <div class="sync-bar">
      <span class="sync-dot yellow" id="syncDot"></span>
      <span id="syncText">数据待接入</span>
      <span class="summary-sep"></span>
      <span id="syncTime">--</span>
    </div>
    
    <!-- KPI 卡片 -->
    <div class="kpi-row" id="kpiRow"></div>
    
    <!-- 子标签 -->
    <div class="sub-tabs" id="subTabs">
      <button class="sub-tab active" data-panel="orders">📦 今日订单</button>
      <button class="sub-tab" data-panel="stock">📊 库存概览</button>
      <button class="sub-tab" data-panel="sales">💰 销售数据</button>
      <button class="sub-tab" data-panel="info">ℹ️ 店铺信息</button>
    </div>
    
    <!-- 面板：今日订单 -->
    <div class="data-panel active" id="panel-orders">
      <table class="data-table">
        <thead><tr><th>订单号</th><th>商品</th><th>规格</th><th>数量</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
        <tbody id="ordersTbody"><tr><td colspan="7" class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无订单数据</div><div class="empty-hint">等待接入货憨憨订单数据</div></td></tr></tbody>
      </table>
    </div>
    
    <!-- 面板：库存概览 -->
    <div class="data-panel" id="panel-stock">
      <div class="card-grid" id="stockGrid">
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">📦</div>
          <div class="empty-text">暂无库存数据</div>
          <div class="empty-hint">等待接入顺运宝库存数据</div>
        </div>
      </div>
    </div>
    
    <!-- 面板：销售数据 -->
    <div class="data-panel" id="panel-sales">
      <div class="card-grid" id="salesGrid">
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">📈</div>
          <div class="empty-text">暂无销售数据</div>
          <div class="empty-hint">等待货憨憨订单数据接入后自动计算</div>
        </div>
      </div>
    </div>
    
    <!-- 面板：店铺信息 -->
    <div class="data-panel" id="panel-info">
      <div class="card-grid" id="infoGrid"></div>
    </div>
  </div>
</main>

<script>
// ═══════ 店铺数据 ═══════
var SHOPS = [
  // 女裝
  {id:"82883997562845632", psid:"1046927985", name:"初見CHUJIAN大碼女裝", cat:"女裝"},
  {id:"80665189540370837", psid:"22089114", name:"琪屿·Vibe", cat:"女裝"},
  {id:"80664972644511936", psid:"1280716333", name:"你的喵系女友 miao", cat:"女裝"},
  {id:"79351975372150453", psid:"106018221", name:"3RISE服飾屋", cat:"女裝"},
  {id:"77878148754504134", psid:"412613193", name:"RoRo中大碼廠家直銷女装", cat:"女裝"},
  {id:"77877515246826654", psid:"7448818", name:"胖妞不愁Emma大尺碼女裝工廠單", cat:"女裝"},
  {id:"77877517394307192", psid:"9071944", name:"Chubby girl 大尺碼女裝", cat:"女裝"},
  // 內衣
  {id:"79351975372152722", psid:"226614044", name:"閑逸·優選內衣庫", cat:"內衣"},
  // 百貨
  {id:"82884150034192194", psid:"1099244142", name:"好幫手百貨旗艦店", cat:"百貨"},
  {id:"20334164", psid:"20334164", name:"動啓萊優選小鋪", cat:"百貨"},
  // 童裝
  {id:"79352179383103437", psid:"349106961", name:"Yoomi悠米童裝~", cat:"童裝"},
  {id:"77878372092810430", psid:"43931660", name:"米農兒童卡通百貨店", cat:"童裝"},
  // 包包
  {id:"82884150034187989", psid:"1173577782", name:"依依原創日韓包包", cat:"包包"},
  // 其他
  {id:"79352179383102966", psid:"16303135", name:"FEI929", cat:"其他"},
  {id:"77527859811746555", psid:"1490101767", name:"Sakura日韓美妝護膚代購", cat:"美妝"},
];
// Wearing Notes 已排除

// ═══════ 渲染侧边栏 ═══════
(function(){
  var sb = document.getElementById('sidebar');
  var cats = {};
  SHOPS.forEach(function(s){
    if(!cats[s.cat]) cats[s.cat] = [];
    cats[s.cat].push(s);
  });
  Object.keys(cats).forEach(function(cat){
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.textContent = cat;
    sb.appendChild(sec);
    cats[cat].forEach(function(s){
      var a = document.createElement('a');
      a.className = 'shop-item';
      a.href = '#';
      a.setAttribute('data-psid', s.psid);
      a.innerHTML = '<span class="shop-dot"></span>' + s.name;
      a.addEventListener('click', function(e){
        e.preventDefault();
        selectShop(s);
        // 高亮
        document.querySelectorAll('.shop-item').forEach(function(x){x.classList.remove('active')});
        a.classList.add('active');
      });
      sb.appendChild(a);
    });
  });
})();

var currentShop = null;

function selectShop(shop){
  currentShop = shop;
  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('shopView').style.display = 'block';
  
  // 标题
  document.getElementById('shopTitle').innerHTML = '🏪 ' + shop.name;
  document.getElementById('shopMeta').innerHTML = 
    '<span class="tag">' + shop.cat + '</span>' +
    '货憨憨ID: <strong>' + shop.id + '</strong>' +
    ' · Shopee: <strong>' + shop.psid + '</strong>';
  
  // KPI
  document.getElementById('kpiRow').innerHTML = 
    '<div class="kpi-card blue"><div class="kpi-num">--</div><div class="kpi-lbl">今日订单</div><div class="kpi-sub">待接入</div></div>' +
    '<div class="kpi-card red"><div class="kpi-num">--</div><div class="kpi-lbl">缺货SKU</div><div class="kpi-sub">待接入</div></div>' +
    '<div class="kpi-card yellow"><div class="kpi-num">--</div><div class="kpi-lbl">低库存 ≤3件</div><div class="kpi-sub">待接入</div></div>' +
    '<div class="kpi-card green"><div class="kpi-num">--</div><div class="kpi-lbl">正常库存</div><div class="kpi-sub">待接入</div></div>' +
    '<div class="kpi-card purple"><div class="kpi-num">--</div><div class="kpi-lbl">在途包裹</div><div class="kpi-sub">待接入</div></div>';
  
  // 店铺信息面板
  document.getElementById('infoGrid').innerHTML =
    '<div class="info-card"><div class="info-title">📋 基本信息</div>' +
      '<div class="info-row"><span class="info-label">店铺名称</span><span class="info-value">' + shop.name + '</span></div>' +
      '<div class="info-row"><span class="info-label">分类</span><span class="info-value">' + shop.cat + '</span></div>' +
      '<div class="info-row"><span class="info-label">货憨憨 ID</span><span class="info-value">' + shop.id + '</span></div>' +
      '<div class="info-row"><span class="info-label">Shopee ID</span><span class="info-value">' + shop.psid + '</span></div>' +
    '</div>' +
    '<div class="info-card"><div class="info-title">📊 数据状态</div>' +
      '<div class="info-row"><span class="info-label">订单数据</span><span class="info-value"><span class="status-tag yellow">待接入</span></span></div>' +
      '<div class="info-row"><span class="info-label">库存数据</span><span class="info-value"><span class="status-tag yellow">待接入</span></span></div>' +
      '<div class="info-row"><span class="info-label">销售统计</span><span class="info-value"><span class="status-tag yellow">待接入</span></span></div>' +
      '<div class="info-row"><span class="info-label">最后更新</span><span class="info-value">--</span></div>' +
    '</div>';
  
  // 重置子标签到第一个
  document.querySelectorAll('.sub-tab').forEach(function(t,i){
    t.classList.toggle('active', i===0);
  });
  document.querySelectorAll('.data-panel').forEach(function(p,i){
    p.classList.toggle('active', i===0);
  });
}

// ═══════ 子标签切换 ═══════
document.getElementById('subTabs').addEventListener('click', function(e){
  if(!e.target.classList.contains('sub-tab')) return;
  var panel = e.target.getAttribute('data-panel');
  document.querySelectorAll('.sub-tab').forEach(function(t){t.classList.remove('active')});
  e.target.classList.add('active');
  document.querySelectorAll('.data-panel').forEach(function(p){p.classList.remove('active')});
  document.getElementById('panel-' + panel).classList.add('active');
});
</script>

</body>
</html>
