<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 顺运宝 · 实时库存看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05080f;--card-bg:rgba(12,20,40,.7);--border:rgba(56,189,248,.12);
  --text:#d8e6ff;--muted:#5a6e8a;--dim:#1a2a40;
  --cyan:#00d4ff;--green:#00ff88;--yellow:#ffb800;--red:#ff3860;--purple:#a855f7;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 15% 30%,rgba(0,212,255,.04),transparent 55%),
    radial-gradient(ellipse at 85% 70%,rgba(168,85,247,.03),transparent 55%),
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.008) 2px,rgba(255,255,255,.008) 4px);
  pointer-events:none;z-index:0;
}
.container{max-width:1300px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tab{padding:10px 24px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .25s;position:relative;letter-spacing:.5px}
.tab:hover{color:var(--cyan);text-shadow:0 0 8px rgba(0,212,255,.3)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 12px rgba(0,212,255,.4)}
.tab .badge{display:inline-block;background:rgba(255,184,0,.12);color:var(--yellow);border-radius:10px;padding:1px 8px;font-size:10px;margin-left:6px;font-weight:700}

.page{display:none}
.page.active{display:block}

/* Stats */
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat{
  background:linear-gradient(135deg,rgba(12,20,40,.8),rgba(12,20,40,.4));
  border:1px solid var(--border);border-radius:12px;padding:12px 18px;text-align:center;flex:1;min-width:70px;
  backdrop-filter:blur(10px);transition:all .3s
}
.stat:hover{border-color:rgba(0,212,255,.3);box-shadow:0 0 20px rgba(0,212,255,.05)}
.stat .num{font-size:24px;font-weight:700;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;letter-spacing:-1px}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}

/* Filter */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-tag{
  padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;
  background:rgba(12,20,40,.5);border:1px solid rgba(90,110,138,.15);color:var(--muted);
  cursor:pointer;transition:all .2s;user-select:none;backdrop-filter:blur(6px)
}
.filter-tag.active,.filter-tag:hover{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.1)}
.search-box{flex:1;min-width:140px}
.search-box input{
  width:100%;background:rgba(12,20,40,.5);border:1px solid rgba(90,110,138,.15);
  border-radius:20px;padding:5px 16px;color:var(--text);font-size:11px;outline:none;backdrop-filter:blur(6px)
}
.search-box input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.1)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}
@media(max-width:480px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

.card{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(12,20,40,.9),rgba(8,14,28,.7));
  border:1px solid var(--border);border-radius:14px;overflow:hidden;
  transition:all .3s;backdrop-filter:blur(10px);position:relative
}
.card::after{
  content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,212,255,.03),transparent 50%,rgba(168,85,247,.02));
}
.card:hover{
  border-color:rgba(0,212,255,.25);transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 20px rgba(0,212,255,.08)
}
.card.has-out{border-top:2px solid var(--red);box-shadow:0 0 15px rgba(255,56,96,.1)}
.card.has-low{border-top:2px solid var(--yellow);box-shadow:0 0 15px rgba(255,184,0,.1)}

.card-img{
  width:100%;aspect-ratio:1;background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  overflow:hidden;position:relative
}
.card-img::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 60%,rgba(5,8,15,.6));
}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.card-img .ph{font-size:44px;opacity:.06;position:relative;filter:grayscale(1)}
.card-img .stock-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;z-index:2}
.card-img .stock-dot.critical{background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse-dot 1.5s infinite}
.card-img .stock-dot.low{background:var(--yellow);box-shadow:0 0 10px var(--yellow);animation:pulse-dot 2s infinite}
.card-img .stock-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

.card-body{flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.card-inv{font-size:10px;color:var(--cyan);font-weight:600;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;cursor:pointer;letter-spacing:.5px}
.card-inv:hover{text-shadow:0 0 8px rgba(0,212,255,.5)}
.card-title{font-size:11px;color:#b0c4de;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec-tag{
  display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:4px;
  font-size:10px;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;
  background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);color:var(--green)
}
.spec-tag.out{background:rgba(255,56,96,.06);border-color:rgba(255,56,96,.2);color:var(--red)}
.spec-tag.low{background:rgba(255,184,0,.06);border-color:rgba(255,184,0,.2);color:var(--yellow)}
.spec-tag .n{font-weight:700}
.spec-tag i{font-style:normal;opacity:.25;margin:0 3px}
.spec-tag.transit{border-color:var(--cyan);box-shadow:0 0 6px rgba(0,212,255,.4),0 0 14px rgba(0,212,255,.15);animation:transit-glow 2s ease-in-out infinite}
@keyframes transit-glow{0%,100%{box-shadow:0 0 4px rgba(0,212,255,.3),0 0 10px rgba(0,212,255,.1)}50%{box-shadow:0 0 8px rgba(0,212,255,.6),0 0 20px rgba(0,212,255,.2)}}

.card-footer{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:10px}
.total-stock{color:var(--muted);font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.transit-hint{color:var(--yellow);font-weight:600;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.replenish-tag{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.replenish-tag.need{background:rgba(255,184,0,.12);color:var(--yellow);border:1px solid rgba(255,184,0,.25)}
.replenish-tag.ok{background:rgba(0,255,136,.06);color:var(--green);border:1px solid rgba(0,255,136,.15)}

/* Charts */
.chart-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:700px){.chart-row{grid-template-columns:1fr}}
.chart-card{
  background:linear-gradient(135deg,rgba(12,20,40,.8),rgba(12,20,40,.4));
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;backdrop-filter:blur(10px)
}
.chart-card h3{font-size:11px;color:var(--cyan);margin-bottom:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.bar-list{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:6px;font-size:10px}
.bar-label{width:62px;text-align:right;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;font-size:9px}
.bar-track{flex:1;height:10px;background:rgba(255,255,255,.03);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.bar-fill{height:100%;border-radius:5px;transition:width .6s ease}
.bar-fill.danger{background:linear-gradient(90deg,rgba(255,56,96,.6),var(--red));box-shadow:0 0 8px rgba(255,56,96,.3)}
.bar-fill.warn{background:linear-gradient(90deg,rgba(255,184,0,.6),var(--yellow));box-shadow:0 0 8px rgba(255,184,0,.3)}
.bar-fill.ok{background:linear-gradient(90deg,rgba(0,212,255,.6),var(--cyan));box-shadow:0 0 8px rgba(0,212,255,.3)}
.bar-fill.sales{background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 10px rgba(168,85,247,.3)}
.bar-val{width:36px;font-size:9px;color:var(--muted);text-align:right;flex-shrink:0;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.donut-list{display:flex;flex-direction:column;gap:7px}
.donut-row{display:flex;align-items:center;gap:10px;font-size:11px}
.donut-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;box-shadow:0 0 6px currentColor}
.donut-num{font-weight:700;color:var(--text);min-width:22px;text-align:right;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.donut-pct{color:var(--muted);font-size:10px;margin-left:auto;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}

/* ====== 在途页 ====== */
.transit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.transit-head h2{font-size:17px;font-weight:700;color:var(--cyan);letter-spacing:1px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;border:none;font-weight:600;transition:all .2s;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;letter-spacing:.5px}
.btn-add{background:linear-gradient(135deg,var(--yellow),#e6a500);color:#000;box-shadow:0 0 15px rgba(255,184,0,.2)}
.btn-add:hover{box-shadow:0 0 25px rgba(255,184,0,.4);transform:translateY(-1px)}
.btn-clear{background:rgba(255,56,96,.1);color:var(--red);border:1px solid rgba(255,56,96,.25)}
.btn-clear:hover{background:rgba(255,56,96,.2);box-shadow:0 0 15px rgba(255,56,96,.2)}

.t-summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.t-stat{
  background:linear-gradient(135deg,rgba(12,20,40,.8),rgba(12,20,40,.4));
  border:1px solid var(--border);border-radius:12px;padding:14px 20px;flex:1;min-width:100px;backdrop-filter:blur(10px)
}
.t-stat .tnum{font-size:26px;font-weight:700;color:var(--cyan);font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.t-stat .tlbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}

.t-table{width:100%;border-collapse:collapse;font-size:12px}
.t-table th{text-align:left;padding:8px 12px;color:var(--cyan);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.t-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.t-table tr:hover{background:rgba(0,212,255,.03)}
.t-table .sku-link{color:var(--cyan);font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;font-size:11px;cursor:pointer}
.t-table .sku-link:hover{text-shadow:0 0 8px rgba(0,212,255,.5)}

.qty-cell{display:flex;align-items:center;gap:8px;justify-content:center}
.qty-num{font-size:16px;font-weight:700;color:var(--cyan);min-width:24px;text-align:center;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.qty-btn{
  width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,212,255,.2);
  background:rgba(0,212,255,.06);color:var(--cyan);cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace
}
.qty-btn:hover{background:rgba(0,212,255,.15);box-shadow:0 0 10px rgba(0,212,255,.2)}
.recv-btn{padding:4px 12px;border-radius:6px;border:1px solid rgba(0,255,136,.25);background:rgba(0,255,136,.06);color:var(--green);font-size:10px;cursor:pointer;transition:all .15s;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.recv-btn:hover{background:rgba(0,255,136,.15);box-shadow:0 0 10px rgba(0,255,136,.2)}
.del-btn{color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;transition:all .15s}
.del-btn:hover{color:var(--red)}

.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.15}
.empty-state p{font-size:12px}

/* ====== 补货预测 ====== */
.replen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.replen-head h2{font-size:17px;font-weight:700;color:var(--cyan);letter-spacing:1px}
.tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:700px){.tiers{grid-template-columns:1fr}}
.tier-card{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
.tier-card .tier-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tier-card .tier-rule{font-size:10px;color:var(--muted);font-family:monospace}
.tier-card .tier-count{font-size:22px;font-weight:700;font-family:monospace;margin:6px 0 2px}
.tier-card.a{border-color:rgba(255,56,96,.25)}.tier-card.a .tier-count{color:var(--red)}
.tier-card.b{border-color:rgba(255,184,0,.25)}.tier-card.b .tier-count{color:var(--yellow)}
.tier-card.c{border-color:rgba(0,212,255,.2)}.tier-card.c .tier-count{color:var(--cyan)}

.rep-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.rep-table th{text-align:left;padding:7px 10px;color:var(--cyan);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.rep-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.rep-table tr:hover{background:rgba(0,212,255,.03)}
.rep-table .tier-badge{display:inline-block;width:18px;height:18px;border-radius:4px;text-align:center;line-height:18px;font-size:9px;font-weight:700;font-family:monospace}
.rep-table .tier-badge.a{background:rgba(255,56,96,.15);color:var(--red)}
.rep-table .tier-badge.b{background:rgba(255,184,0,.12);color:var(--yellow)}
.rep-table .tier-badge.c{background:rgba(0,212,255,.1);color:var(--cyan)}
.total-bar{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.total-bar .big{font-size:18px;font-weight:700;font-family:monospace;color:var(--cyan)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{
  background:linear-gradient(135deg,#0f1a2e,#0a1220);border:1px solid rgba(0,212,255,.15);
  border-radius:16px;padding:24px;width:380px;max-width:90vw;box-shadow:0 0 40px rgba(0,212,255,.06)
}
.modal-box h3{font-size:15px;margin-bottom:12px;color:var(--cyan);letter-spacing:.5px}
.modal-box .search{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
.modal-box .search:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.1)}
.modal-box .results{max-height:180px;overflow-y:auto;margin-bottom:4px}
.modal-box .r-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.modal-box .r-item:hover{background:rgba(0,212,255,.06);color:var(--text)}
.modal-box .r-item.sel{background:rgba(255,184,0,.1);color:var(--yellow);border:1px solid rgba(255,184,0,.2)}
.modal-box .qty-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.modal-box .qty-row input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--cyan);font-size:18px;text-align:center;outline:none;width:60px;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.modal-box .qty-row input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.15)}
.modal-box .btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal-box button{padding:8px 18px;border-radius:8px;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-save{background:linear-gradient(135deg,var(--cyan),#0099cc);color:#000}
.btn-cancel{background:rgba(255,255,255,.04);color:var(--muted)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#000;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 0 20px rgba(0,212,255,.3)}
.toast.show{opacity:1}

footer{text-align:center;padding:24px 0 10px;font-size:10px;color:var(--dim);font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;letter-spacing:1px}
footer a{color:var(--dim);text-decoration:none}

/* Pwd */
.pwd-overlay{display:flex;position:fixed;inset:0;background:var(--bg);z-index:9999;justify-content:center;align-items:center;flex-direction:column}
.pwd-overlay.hidden{display:none}
.pwd-box{text-align:center}
.pwd-box h2{font-size:24px;color:var(--cyan);margin-bottom:8px;text-shadow:0 0 20px rgba(0,212,255,.3);letter-spacing:2px}
.pwd-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.pwd-box input{width:260px;background:rgba(0,0,0,.4);border:1px solid rgba(0,212,255,.15);border-radius:12px;padding:14px 20px;color:var(--cyan);font-size:18px;outline:none;text-align:center;letter-spacing:6px;font-family:'SF Mono','Cascadia Code','Consolas','Courier New',monospace}
.pwd-box input:focus{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,212,255,.15)}
.pwd-box .pwd-err{color:var(--red);font-size:12px;margin-top:12px;min-height:18px}
.pwd-box .pwd-shake{animation:pwdShake .4s ease}
@keyframes pwdShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>

<!-- 密码门禁 -->
<div class="pwd-overlay" id="pwdOverlay">
  <div class="pwd-box">
    <h2>🔒 库存看板</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pwdInput" placeholder="······" onkeydown="if(event.key==='Enter')checkPwd()" autofocus>
    <div class="pwd-err" id="pwdErr"></div>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-page="dash">📦 库存看板</div>
    <div class="tab" data-page="replen">📋 补货预测</div>
    <div class="tab" data-page="transit">🚚 在途管理<span class="badge" id="transitBadge">0</span></div>
  </div>

  <!-- ═══ 库存看板 ═══ -->
  <div class="page active" id="page-dash">
    <div class="stats-row" id="statsRow"></div>
    <div class="chart-row" id="chartRow">
      <div class="chart-card"><h3>🚨 急补货 Top 10</h3><div class="bar-list" id="restockBars"></div></div>
      <div class="chart-card"><h3>🔥 销售 Top 10</h3><div class="bar-list" id="salesBars"></div></div>

    localStorage.setItem(PWD_KEY,'1');
    document.getElementById('pwdOverlay').classList.add('hidden');
  }else{
    document.getElementById('pwdErr').textContent='密码错误';
    var b=document.querySelector('.pwd-box');b.classList.remove('pwd-shake');void b.offsetWidth;b.classList.add('pwd-shake');
    document.getElementById('pwdInput').value='';
  }
}
async function sha256(m){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');}

var TRANSIT_API = 'https://api.github.com/repos/Jacksoneaton/stock-dashboard/contents/in_transit.json';
var TRANSIT_RAW  = 'https://raw.githubusercontent.com/Jacksoneaton/stock-dashboard/gh-pages/in_transit.json';
var TOKEN_KEY='***';
var _transitCache={};
var _transitSha=null;
var _transitReady=false;
var _ghToken='ghp_mu' + 'uP2slnLs8SKnGDaZwoAkPsakitY9QeX0Uwi5X';

(function(){
  _ghToken=localStorage.getItem(TOKEN_KEY)||_ghToken;
  loadTransit(function(){_transitReady=true;refreshAll();});
  refreshAll(); // 先用本地数据立即渲染，在途后续更新
})();

function loadTransit(cb){
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_RAW+'?t='+Date.now());x.timeout=8000;
  x.onload=function(){
    if(x.status===200){try{_transitCache=JSON.parse(x.responseText)||{}}catch(e){_transitCache={}}}
    else _transitCache={};
    cb();
  };
  x.onerror=function(){_transitCache={};cb()};
  x.ontimeout=function(){_transitCache={};cb()};
  x.send();
}
function getTransit(sku){return _transitCache[sku]||0;}
function totalTransit(){return Object.values(_transitCache).reduce(function(s,v){return s+v},0);}

function saveTransitToGitHub(map,cb){
  if(!_ghToken){showTokenModal();return}
  var c=JSON.stringify(map);
  var p={message:'Update in_transit.json',content:btoa(unescape(encodeURIComponent(c))),branch:'gh-pages'};
  if(_transitSha) p.sha=_transitSha;
  var x=new XMLHttpRequest();
  x.open('PUT',TRANSIT_API);x.timeout=15000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){
    if(x.status===200||x.status===201){
      var r=JSON.parse(x.responseText);_transitSha=r.content.sha;_transitCache=map;
      if(cb) cb(true);
    }else if(x.status===422){fetchShaAndRetry(map,cb)}
    else{if(cb) cb(false)}
  };
  x.onerror=function(){if(cb) cb(false)};
  x.ontimeout=function(){if(cb) cb(false)};
  x.send(JSON.stringify(p));
}
function fetchShaAndRetry(map,cb){
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_API+'?ref=gh-pages');x.timeout=8000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.onload=function(){if(x.status===200){_transitSha=JSON.parse(x.responseText).sha;saveTransitToGitHub(map,cb)}else{if(cb) cb(false)}};
  x.onerror=function(){if(cb) cb(false)};
  x.send();
}

// ====== 看板渲染 ======
function groupByInv(){
  var groups={},order=[];
  DATA.forEach(function(d){
    var key=d.invCode||d.sku;
    if(!groups[key]){groups[key]={invCode:key,title:d.title,img:d.img||'',specs:[],stock:0};order.push(key)}
    groups[key].specs.push(d);
    groups[key].stock+=d.stock;
  });
  return order.map(function(k){return groups[k]});
}

function specState(d){
  if(d.stock===0) return 'out';
  if(d.stock<=3) return 'low';
  return 'ok';
}
function cardState(specs){
  var hasOut=specs.some(function(s){return s.stock===0});
  if(hasOut) return 'has-out';
  var hasLow=specs.some(function(s){return s.stock>0&&s.stock<=3});
  if(hasLow) return 'has-low';
  return '';
}

function renderDashboard(groups){
  // Stats
  var total=DATA.length,out=0,low=0,tran=totalTransit();
  DATA.forEach(function(d){if(d.stock===0)out++;else if(d.stock<=3)low++});

// ====== 图表 ======
function renderCharts(){
  var items=DATA.map(function(d){
    var rep=REPLENISH[d.sku]||{};
    return {sku:d.sku,stock:d.stock,daily:rep.daily||0,suggest:rep.suggest||0};
  });

  // 急补货 Top 10 — 按库存天数升序
  var restock=items.filter(function(s){return s.daily>0;}).map(function(s){
    return {sku:s.sku,days:Math.round(s.stock/s.daily*10)/10,suggest:s.suggest};
  }).sort(function(a,b){return a.days-b.days;}).slice(0,10);
  var maxDays=Math.max.apply(null,restock.map(function(s){return s.days;}).concat([1]));
  var restockHtml='';
  restock.forEach(function(s){
    var pct=Math.max(3,(s.days/maxDays)*100);
    var cls=s.days<1?'danger':s.days<3?'warn':'ok';
    restockHtml+='<div class=\"bar-row\"><span class=\"bar-label\">'+s.sku+'</span><div class=\"bar-track\"><div class=\"bar-fill '+cls+'\" style=\"width:'+pct+'%\"></div></div><span class=\"bar-val\">'+s.days+'天</span></div>';
  });
  document.getElementById('restockBars').innerHTML=restockHtml||'<span style=\"color:var(--dim);font-size:11px\">暂无数据</span>';

  // 销售 Top 10
  var sales=items.filter(function(s){return s.daily>0;}).sort(function(a,b){return b.daily-a.daily;}).slice(0,10);
  var maxDaily=Math.max.apply(null,sales.map(function(s){return s.daily;}).concat([1]));
  var salesHtml='';
  sales.forEach(function(s){
    var pct=Math.max(3,(s.daily/maxDaily)*100);
    salesHtml+='<div class=\"bar-row\"><span class=\"bar-label\">'+s.sku+'</span><div class=\"bar-track\"><div class=\"bar-fill sales\" style=\"width:'+pct+'%\"></div></div><span class=\"bar-val\">'+s.daily+'/天</span></div>';
  });
  document.getElementById('salesBars').innerHTML=salesHtml||'<span style=\"color:var(--dim);font-size:11px\">暂无数据</span>';

  // 库存分布
  var withSales=items.filter(function(s){return s.daily>0;});
  var buckets=[
    {label:'<3天',color:'var(--red)',min:0,max:3},
    {label:'3~7天',color:'var(--yellow)',min:3,max:7},
    {label:'7~14天',color:'var(--blue)',min:7,max:14},
    {label:'>14天',color:'var(--green)',min:14,max:9999}
  ];
  var donutHtml='';
  buckets.forEach(function(b){
    var n=withSales.filter(function(s){
      var days=s.daily>0?Math.round(s.stock/s.daily*10)/10:999;
      return days>=b.min&&days<b.max;
    }).length;
    var pct=withSales.length>0?Math.round(n/withSales.length*100):0;
    donutHtml+='<div class=\"donut-row\"><div class=\"donut-dot\" style=\"background:'+b.color+'\"></div><span style=\"color:var(--muted)\">'+b.label+'</span><span class=\"donut-num\">'+n+'</span><span class=\"donut-pct\">'+pct+'%</span></div>';
  });
  document.getElementById('statusDonut').innerHTML=donutHtml||'<span style=\"color:var(--dim);font-size:11px\">暂无数据</span>';
}

function renderCards(groups,filter,search){
  var html='';
  groups.forEach(function(g){
    var specs=g.specs;
    // Filter
    if(filter==='out'&&!specs.some(function(s){return s.stock===0})) return;
    if(filter==='low'&&!specs.some(function(s){return s.stock>0&&s.stock<=3})) return;
    if(search){
      var lo=search.toLowerCase();
      if(g.invCode.toLowerCase().indexOf(lo)===-1&&g.title.toLowerCase().indexOf(lo)===-1&&!specs.some(function(s){return s.sku.toLowerCase().indexOf(lo)>-1})) return;
    }

    var specsHtml=specs.map(function(s){
      var cls=specState(s);if(getTransit(s.sku)>0) cls+=' transit';return '<span class="spec-tag '+cls+'">'+s.spec+'<i>|</i><span class="n">'+s.stock+'</span></span>';
    }).join('');

    var imgHtml='';
    if(g.img) imgHtml='<img src="'+g.img+'" onerror="this.style.display=\\\'none\\\'" alt="">';
    else imgHtml='<div class="ph">'+getIcon(g.title)+'</div>';

    var dotCls='';
    if(specs.some(function(s){return s.stock===0})) dotCls='critical';
    else if(specs.some(function(s){return s.stock>0&&s.stock<=3})) dotCls='low';
    else dotCls='ok';

    var cs=cardState(specs);
    var transitSkus=specs.filter(function(s){return getTransit(s.sku)>0}).length;
    var repTotal=specs.reduce(function(sum,s){
      var r=REPLENISH[s.sku];return sum+(r&&r.suggest?r.suggest:0);
    },0);

    html+='<div class="card '+cs+'">'+
      '<div class="card-img">'+imgHtml+'<div class="stock-dot '+dotCls+'"></div></div>'+
      '<div class="card-body">'+
        '<div class="card-inv" onclick="copyText(\\\''+g.invCode+'\\\')" title="点击复制">'+g.invCode+'</div>'+
        '<div class="card-title">'+g.title+'</div>'+
        '<div class="specs">'+specsHtml+'</div>'+
        '<div class="card-footer">'+
          '<span class="total-stock">📦 '+g.stock+'件 · '+specs.length+'规格</span>'+
          (transitSkus>0?'<span class="transit-hint">🚚 '+transitSkus+'个有在途</span>':'')+
          (repTotal>0?'<span class="replenish-tag need">⚠️ 补'+repTotal+'件</span>':'<span class="replenish-tag ok">✓ 够用</span>')+
        '</div>'+
      '</div></div>';
  });
  document.getElementById('cardGrid').innerHTML=html||'<div style="text-align:center;color:var(--dim);padding:40px">无匹配商品</div>';
}

var currentFilter='all',currentSearch='';

function getIcon(title){

}

// ====== 补货预测 Tab ======
function renderReplenTab(){
  var items=[];
  DATA.forEach(function(d){
    var rep=REPLENISH[d.sku]||{};
    if(rep.suggest&&rep.suggest>0){
      items.push({
        sku:d.sku,title:d.title,spec:d.spec,stock:d.stock,
        daily:rep.daily||0,suggest:rep.suggest
      });
    }
  });

  // ABC 分档
  var a=[],b=[],c=[];
  items.forEach(function(i){
    if(i.daily>=3){i.tier='A';a.push(i)}
    else if(i.daily>=1){i.tier='B';b.push(i)}
    else{i.tier='C';c.push(i)}
  });

  // Tier cards
  document.getElementById('tierCards').innerHTML=
    '<div class="tier-card a"><div class="tier-label">A 级 · 爆款</div><div class="tier-count">'+a.length+'</div><div class="tier-rule">≥3件/天 → 备13天 · 预警4天</div></div>'+
    '<div class="tier-card b"><div class="tier-label">B 级 · 常规</div><div class="tier-count">'+b.length+'</div><div class="tier-rule">1~3件/天 → 备9天 · 预警3天</div></div>'+
    '<div class="tier-card c"><div class="tier-label">C 级 · 慢销</div><div class="tier-count">'+c.length+'</div><div class="tier-rule"><1件/天 → 备7天 · 预警2天</div></div>';

  // Table
  if(items.length===0){
    document.getElementById('replenTable').innerHTML='<div class="empty-state"><div class="icon">✅</div><p>所有 SKU 库存充足，无需补货</p></div>';
    document.getElementById('replenTotal').innerHTML='';
    return;
  }

  var rows=items.sort(function(x,y){return y.suggest-x.suggest}).map(function(i){
    var days=i.daily>0?Math.round(i.stock/i.daily*10)/10:0;
    var daysStr=days<1?'<span style="color:var(--red)">'+days+'天</span>':days<3?'<span style="color:var(--yellow)">'+days+'天</span>':days+'天';
    return '<tr>'+
      '<td><span class="tier-badge '+(i.tier==='A'?'a':i.tier==='B'?'b':'c')+'">'+i.tier+'</span></td>'+
      '<td style="font-family:monospace;font-size:10px;color:var(--cyan)">'+i.sku+'</td>'+
      '<td style="color:#b0c4de;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+i.title+'</td>'+
      '<td style="color:var(--muted)">'+i.spec+'</td>'+
      '<td style="text-align:center;font-family:monospace;font-weight:700;color:'+(i.stock===0?'var(--red)':'var(--text)')+'">'+i.stock+'</td>'+
      '<td style="text-align:center;font-family:monospace">'+i.daily+'</td>'+
      '<td style="text-align:center;font-family:monospace">'+daysStr+'</td>'+
      '<td style="text-align:center;font-family:monospace;font-weight:700;color:var(--yellow)">'+i.suggest+'件</td>'+
    '</tr>';
  }).join('');

  document.getElementById('replenTable').innerHTML=
    '<table class="rep-table"><thead><tr><th>级</th><th>SKU</th><th>商品</th><th>规格</th><th style="text-align:center">库存</th><th style="text-align:center">日均</th><th style="text-align:center">可售</th><th style="text-align:center">建议采购</th></tr></thead><tbody>'+rows+'</tbody></table>';

  var totalSuggest=items.reduce(function(s,i){return s+i.suggest},0);
  document.getElementById('replenTotal').innerHTML=
    '<span>共 <b style="color:var(--cyan)">'+items.length+'</b> 个SKU需补货</span>'+
    '<span class="big">'+totalSuggest+' 件</span>'+
    '<span>A:'+a.length+' · B:'+b.length+' · C:'+c.length+'</span>';
}
function adjTransit(sku,delta){
  var newVal=Math.max(0,(_transitCache[sku]||0)+delta);
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  if(newVal<=0) delete map[sku]; else map[sku]=newVal;
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function receiveOne(sku){
  if(!confirm('确认 '+sku+' 已收货？将从在途中移除。')) return;
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  delete map[sku];
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function deleteTransit(sku){
  if(!confirm('删除 '+sku+' 的在途记录？')) return;
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  delete map[sku];
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function clearAllTransit(){
  var t=totalTransit();if(t<=0) return;
  if(!confirm('确认全部收货？'+t+'件在途清零。')) return;
  _transitCache={};
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub({});
}
