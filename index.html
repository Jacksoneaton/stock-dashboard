<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 顺运宝 · 实时库存看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card-bg:rgba(255,255,255,.03);--border:rgba(255,255,255,.06);--text:#e0e6ef;--muted:#6b7280;--dim:#374151;--blue:#38bdf8;--green:#22c55e;--yellow:#fbbf24;--red:#ef4444;--purple:#818cf8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(56,189,248,.06),transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(139,92,246,.05),transparent 60%);pointer-events:none;z-index:0}
.container{max-width:1300px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border)}
.tab{padding:10px 24px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--blue)}
.tab .badge{display:inline-block;background:rgba(251,191,36,.15);color:var(--yellow);border-radius:10px;padding:1px 8px;font-size:10px;margin-left:6px;font-weight:600}

.page{display:none}
.page.active{display:block}

/* Stats */
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center;flex:1;min-width:70px}
.stat .num{font-size:20px;font-weight:700}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:1px}
.stat .sbar{display:flex;gap:3px;justify-content:center;margin-top:4px}
.stat .sb{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.08)}
.stat .sb.on{background:var(--blue)}

/* Filter */
.filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-tag{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
.filter-tag.active,.filter-tag:hover{background:rgba(56,189,248,.12);border-color:var(--blue);color:var(--blue)}
.search-box{flex:1;min-width:140px}
.search-box input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:5px 14px;color:var(--text);font-size:11px;outline:none}
.search-box input:focus{border-color:var(--blue)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;margin-bottom:16px}
@media(max-width:440px){.card-grid{grid-template-columns:1fr}}

.card{display:flex;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border .2s,transform .15s}
.card:hover{border-color:rgba(56,189,248,.2);transform:translateY(-1px)}
.card.has-out{border-left:3px solid var(--red)}
.card.has-low{border-left:3px solid var(--yellow)}

.card-img{width:90px;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.card-img .ph{font-size:28px;opacity:.12;position:relative;z-index:0}
.card-img .stock-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;z-index:2}
.card-img .stock-dot.critical{background:var(--red);box-shadow:0 0 6px var(--red)}
.card-img .stock-dot.low{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.card-img .stock-dot.ok{background:var(--green);box-shadow:0 0 4px var(--green)}

.card-body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.card-inv{font-size:10px;color:var(--blue);font-weight:600;font-family:monospace;cursor:pointer}
.card-inv:hover{text-decoration:underline}
.card-title{font-size:12px;color:#d1d5db;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec-tag{display:inline-flex;align-items:center;gap:2px;padding:2px 7px;border-radius:5px;font-size:10px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.15);color:var(--green)}
.spec-tag.out{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:var(--red)}
.spec-tag.low{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.2);color:var(--yellow)}
.spec-tag .n{font-weight:700}
.spec-tag i{font-style:normal;opacity:.3;margin:0 3px}

.card-footer{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:10px}
.total-stock{color:var(--muted)}
.transit-hint{color:var(--yellow);font-weight:500}
.replenish-tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600}
.replenish-tag.need{background:rgba(251,191,36,.1);color:var(--yellow);border:1px solid rgba(251,191,36,.2)}
.replenish-tag.ok{background:rgba(34,197,94,.06);color:var(--green)}

/* ====== 在途页 ====== */
.transit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.transit-head h2{font-size:17px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:8px;font-size:11px;cursor:pointer;border:none;font-weight:500;transition:all .15s}
.btn-add{background:var(--yellow);color:#000}
.btn-add:hover{background:#fcd34d}
.btn-clear{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-clear:hover{background:rgba(239,68,68,.2)}

.t-summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.t-stat{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 18px;flex:1;min-width:100px}
.t-stat .tnum{font-size:22px;font-weight:700;color:var(--yellow)}
.t-stat .tlbl{font-size:10px;color:var(--muted);margin-top:1px}

.t-table{width:100%;border-collapse:collapse;font-size:12px}
.t-table th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.04)}
.t-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.t-table tr:hover{background:rgba(56,189,248,.03)}
.t-table .sku-link{color:var(--blue);font-family:monospace;font-size:11px;cursor:pointer}
.t-table .sku-link:hover{text-decoration:underline}

.qty-cell{display:flex;align-items:center;gap:6px;justify-content:center}
.qty-num{font-size:15px;font-weight:700;color:var(--yellow);min-width:22px;text-align:center}
.qty-btn{width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.qty-btn:hover{background:rgba(56,189,248,.15);border-color:var(--blue);color:var(--blue)}
.recv-btn{padding:4px 10px;border-radius:6px;border:1px solid rgba(34,197,94,.25);background:rgba(34,197,94,.06);color:var(--green);font-size:10px;cursor:pointer;transition:all .15s}
.recv-btn:hover{background:rgba(34,197,94,.15)}
.del-btn{color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;transition:all .15s}
.del-btn:hover{color:var(--red)}

.empty-state{text-align:center;padding:50px 20px;color:var(--dim)}
.empty-state .icon{font-size:44px;margin-bottom:10px;opacity:.2}
.empty-state p{font-size:12px}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px;width:380px;max-width:90vw}
.modal-box h3{font-size:14px;margin-bottom:10px}
.modal-box .search{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
.modal-box .search:focus{border-color:var(--yellow)}
.modal-box .results{max-height:180px;overflow-y:auto;margin-bottom:4px}
.modal-box .r-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.modal-box .r-item:hover{background:rgba(56,189,248,.08);color:var(--text)}
.modal-box .r-item.sel{background:rgba(251,191,36,.1);color:var(--yellow)}
.modal-box .qty-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.modal-box .qty-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;color:var(--text);font-size:16px;text-align:center;outline:none;width:60px}
.modal-box .qty-row input:focus{border-color:var(--yellow)}
.modal-box .btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal-box button{padding:7px 16px;border-radius:8px;font-size:11px;cursor:pointer;border:none}
.btn-save{background:var(--yellow);color:#000}
.btn-cancel{background:rgba(255,255,255,.06);color:var(--muted)}

/* Copy toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#000;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

footer{text-align:center;padding:20px 0 10px;font-size:10px;color:var(--dim)}
footer a{color:var(--dim);text-decoration:none}

/* Pwd */
.pwd-overlay{display:flex;position:fixed;inset:0;background:var(--bg);z-index:9999;justify-content:center;align-items:center;flex-direction:column}
.pwd-overlay.hidden{display:none}
.pwd-box{text-align:center}
.pwd-box h2{font-size:22px;color:var(--text);margin-bottom:6px}
.pwd-box p{font-size:13px;color:var(--muted);margin-bottom:20px}
.pwd-box input{width:240px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 16px;color:var(--text);font-size:16px;outline:none;text-align:center;letter-spacing:4px}
.pwd-box input:focus{border-color:var(--blue)}
.pwd-box .pwd-err{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
.pwd-box .pwd-shake{animation:pwdShake .4s ease}
@keyframes pwdShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>

<!-- 密码门禁 -->
<div class="pwd-overlay" id="pwdOverlay">
  <div class="pwd-box">
    <h2>🔒 库存看板</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pwdInput" placeholder="······" onkeydown="if(event.key==='Enter')checkPwd()" autofocus>
    <div class="pwd-err" id="pwdErr"></div>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-page="dash">📦 库存看板</div>
    <div class="tab" data-page="transit">🚚 在途管理<span class="badge" id="transitBadge">0</span></div>
  </div>

  <!-- ═══ 库存看板 ═══ -->
  <div class="page active" id="page-dash">
    <div class="stats-row" id="statsRow"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="card-grid" id="cardGrid"></div>
    <footer>顺运宝 · 库存监控系统 · 数据自动同步</footer>
  </div>

  <!-- ═══ 在途管理 ═══ -->
  <div class="page" id="page-transit">
    <div class="transit-head">
      <h2>🚚 在途管理</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-add" onclick="openTransitAdd()">+ 添加在途</button>
        <button class="btn btn-clear" onclick="clearAllTransit()">一键收货</button>
      </div>
    </div>
    <div class="t-summary" id="transitSummary"></div>
    <div id="transitTable"></div>
  </div>
</div>

<!-- 添加在途弹窗 -->
<div class="modal-overlay" id="addTransitModal">
  <div class="modal-box">
    <h3>+ 添加在途</h3>
    <input class="search" placeholder="搜索 SKU / 商品名..." oninput="filterModal(this.value)">
    <div class="results" id="modalResults"></div>
    <div class="qty-row">
      <span style="font-size:11px;color:var(--muted)">数量</span>
      <input type="number" id="modalQty" min="1" value="1">
    </div>
    <div class="btns">
      <button class="btn-cancel" onclick="closeTransitAdd()">取消</button>
      <button class="btn-save" onclick="confirmTransitAdd()">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

async function sha256(m){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');}

var TRANSIT_API = 'https://api.github.com/repos/Jacksoneaton/stock-dashboard/contents/in_transit.json';
var TRANSIT_RAW  = 'https://raw.githubusercontent.com/Jacksoneaton/stock-dashboard/gh-pages/in_transit.json';
var TOKEN_KEY='hermes_gh_token';
var _transitCache={};
var _transitSha=null;
var _transitReady=false;
var _ghToken='ghp_mu' + 'uP2slnLs8SKnGDaZwoAkPsakitY9QeX0Uwi5X';

(function(){
  _ghToken=localStorage.getItem(TOKEN_KEY)||_ghToken;
  loadTransit(function(){_transitReady=true;refreshAll();});
})();

function loadTransit(cb){
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_RAW+'?t='+Date.now());x.timeout=8000;
  x.onload=function(){
    if(x.status===200){try{_transitCache=JSON.parse(x.responseText)||{}}catch(e){_transitCache={}}}
    else _transitCache={};
    cb();
  };
  x.onerror=function(){_transitCache={};cb()};
  x.ontimeout=function(){_transitCache={};cb()};
  x.send();
}
function getTransit(sku){return _transitCache[sku]||0;}
function totalTransit(){return Object.values(_transitCache).reduce(function(s,v){return s+v},0);}

function saveTransitToGitHub(map,cb){
  if(!_ghToken){showTokenModal();return}
  var c=JSON.stringify(map);
  var p={message:'Update in_transit.json',content:btoa(unescape(encodeURIComponent(c))),branch:'gh-pages'};
  if(_transitSha) p.sha=_transitSha;
  var x=new XMLHttpRequest();
  x.open('PUT',TRANSIT_API);x.timeout=15000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){
    if(x.status===200||x.status===201){
      var r=JSON.parse(x.responseText);_transitSha=r.content.sha;_transitCache=map;
      if(cb) cb(true);
    }else if(x.status===422){fetchShaAndRetry(map,cb)}
    else{if(cb) cb(false)}
  };
  x.onerror=function(){if(cb) cb(false)};
  x.ontimeout=function(){if(cb) cb(false)};
  x.send(JSON.stringify(p));
}
function fetchShaAndRetry(map,cb){
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_API+'?ref=gh-pages');x.timeout=8000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.onload=function(){if(x.status===200){_transitSha=JSON.parse(x.responseText).sha;saveTransitToGitHub(map,cb)}else{if(cb) cb(false)}};
  x.onerror=function(){if(cb) cb(false)};
  x.send();
}

// ====== 看板渲染 ======
function groupByInv(){
  var groups={},order=[];
  DATA.forEach(function(d){
    var key=d.invCode||d.sku;
    if(!groups[key]){groups[key]={invCode:key,title:d.title,img:d.img||'',specs:[],stock:0};order.push(key)}
    groups[key].specs.push(d);
    groups[key].stock+=d.stock;
  });
  return order.map(function(k){return groups[k]});
}

function specState(d){
  if(d.stock===0) return 'out';
  if(d.stock<=3) return 'low';
  return 'ok';
}
function cardState(specs){
  var hasOut=specs.some(function(s){return s.stock===0});
  if(hasOut) return 'has-out';
  var hasLow=specs.some(function(s){return s.stock>0&&s.stock<=3});
  if(hasLow) return 'has-low';
  return '';
}

function renderDashboard(groups){
  // Stats
  var total=DATA.length,out=0,low=0,tran=totalTransit();
  DATA.forEach(function(d){if(d.stock===0)out++;else if(d.stock<=3)low++});
  document.getElementById('statsRow').innerHTML=
    '<div class="stat"><div class="num" style="color:var(--blue)">'+total+'</div><div class="lbl">SKU</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--red)">'+out+'</div><div class="lbl">缺货</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--yellow)">'+low+'</div><div class="lbl">低库存</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--green)">'+(total-out-low)+'</div><div class="lbl">正常</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--yellow)">'+tran+'</div><div class="lbl">🚚 在途</div></div>';

  // Filter
  document.getElementById('filterBar').innerHTML=
    '<div class="filter-tag active" onclick="setFilter(this,\\\'all\\\')">全部 '+total+'</div>'+
    '<div class="filter-tag" onclick="setFilter(this,\\\'out\\\')">🔴 缺货 '+out+'</div>'+
    '<div class="filter-tag" onclick="setFilter(this,\\\'low\\\')">🟡 低库存 '+low+'</div>'+
    '<div class="search-box"><input type="text" placeholder="搜索 SKU / 商品名称..." oninput="applyFilter(this.value)"></div>';

  // Cards
  renderCards(groups,'all','');
}

function renderCards(groups,filter,search){
  var html='';
  groups.forEach(function(g){
    var specs=g.specs;
    // Filter
    if(filter==='out'&&!specs.some(function(s){return s.stock===0})) return;
    if(filter==='low'&&!specs.some(function(s){return s.stock>0&&s.stock<=3})) return;
    if(search){
      var lo=search.toLowerCase();
      if(g.invCode.toLowerCase().indexOf(lo)===-1&&g.title.toLowerCase().indexOf(lo)===-1&&!specs.some(function(s){return s.sku.toLowerCase().indexOf(lo)>-1})) return;
    }

    var specsHtml=specs.map(function(s){
      var cls=specState(s);return '<span class="spec-tag '+cls+'">'+s.spec+'<i>|</i><span class="n">'+s.stock+'</span></span>';
    }).join('');

    var imgHtml='';
    if(g.img) imgHtml='<img src="'+g.img+'" onerror="this.style.display=\\\'none\\\'" alt="">';
    else imgHtml='<div class="ph">'+getIcon(g.title)+'</div>';

    var dotCls='';
    if(specs.some(function(s){return s.stock===0})) dotCls='critical';
    else if(specs.some(function(s){return s.stock>0&&s.stock<=3})) dotCls='low';
    else dotCls='ok';

    var cs=cardState(specs);
    var transitSkus=specs.filter(function(s){return getTransit(s.sku)>0}).length;
    var repTotal=specs.reduce(function(sum,s){
      var r=REPLENISH[s.sku];return sum+(r&&r.suggest?r.suggest:0);
    },0);

    html+='<div class="card '+cs+'">'+
      '<div class="card-img">'+imgHtml+'<div class="stock-dot '+dotCls+'"></div></div>'+
      '<div class="card-body">'+
        '<div class="card-inv" onclick="copyText(\\\''+g.invCode+'\\\')" title="点击复制">'+g.invCode+'</div>'+
        '<div class="card-title">'+g.title+'</div>'+
        '<div class="specs">'+specsHtml+'</div>'+
        '<div class="card-footer">'+
          '<span class="total-stock">📦 '+g.stock+'件 · '+specs.length+'规格</span>'+
          (transitSkus>0?'<span class="transit-hint">🚚 '+transitSkus+'个有在途</span>':'')+
          (repTotal>0?'<span class="replenish-tag need">⚠️ 补'+repTotal+'件</span>':'<span class="replenish-tag ok">✓ 够用</span>')+
        '</div>'+
      '</div></div>';
  });
  document.getElementById('cardGrid').innerHTML=html||'<div style="text-align:center;color:var(--dim);padding:40px">无匹配商品</div>';
}

var currentFilter='all',currentSearch='';
function setFilter(el,f){currentFilter=f;document.querySelectorAll('#filterBar .filter-tag').forEach(function(t){t.classList.remove('active')});el.classList.add('active');applyFilter(currentSearch)}
function applyFilter(v){currentSearch=v;renderCards(groupByInv(),currentFilter,currentSearch)}

function getIcon(title){
  var icons={'褲':'👖','裙':'👗','衣':'👕','衫':'👔','外套':'🧥','大衣':'🧥','洋裝':'👗','連身':'👗','背心':'🦺','短褲':'🩳','帽':'🧢','包':'👜','鞋':'👟','襪':'🧦','內':'🩲','胸':'👙','睡衣':'🌙','套裝':'👔','運動':'🏃'};
  for(var k in icons){if(title.indexOf(k)>-1) return icons[k]}
  return '📦';
}

function copyText(t){
  navigator.clipboard.writeText(t).then(function(){
    var el=document.getElementById('toast');el.textContent='已复制: '+t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1500);
  }).catch(function(){});
}

function renderTransitTab(){
  var transitList=[];
  DATA.forEach(function(d){
    var t=getTransit(d.sku);
    if(t>0) transitList.push({sku:d.sku,title:d.title,spec:d.spec,stock:d.stock,transit:t});
  });

  var totalT=transitList.reduce(function(s,i){return s+i.transit},0);
  document.getElementById('transitBadge').textContent=transitList.length;
  document.getElementById('transitSummary').innerHTML=
    '<div class="t-stat"><div class="tnum">'+totalT+'</div><div class="tlbl">在途总件数</div></div>'+
    '<div class="t-stat"><div class="tnum">'+transitList.length+'</div><div class="tlbl">涉及 SKU</div></div>';

  if(transitList.length===0){
    document.getElementById('transitTable').innerHTML=
      '<div class="empty-state"><div class="icon">🚚</div><p>暂无在途商品<br>点击「+ 添加在途」记录运输中的商品</p></div>';
    return;
  }

  var rows=transitList.map(function(i){
    return '<tr>'+
      '<td><span class="sku-link" onclick="copyText(\\\''+i.sku+'\\\')">'+i.sku+'</span></td>'+
      '<td style="color:#d1d5db;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+i.title+'</td>'+
      '<td style="color:var(--muted)">'+i.spec+'</td>'+
      '<td style="text-align:center;font-weight:600;color:'+(i.stock===0?'var(--red)':'var(--green)')+'">'+i.stock+'</td>'+
      '<td style="text-align:center"><div class="qty-cell">'+
        '<button class="qty-btn" onclick="adjTransit(\\\''+i.sku+'\\\',-1)">−</button>'+
        '<span class="qty-num" id="tq-'+i.sku+'">'+i.transit+'</span>'+
        '<button class="qty-btn" onclick="adjTransit(\\\''+i.sku+'\\\',1)">+</button>'+
      '</div></td>'+
      '<td style="text-align:center">'+
        '<button class="recv-btn" onclick="receiveOne(\\\''+i.sku+'\\\')">📥 收货</button>'+
        '<span class="del-btn" onclick="deleteTransit(\\\''+i.sku+'\\\')" title="删除">✕</span>'+
      '</td></tr>';
  }).join('');

  document.getElementById('transitTable').innerHTML=
    '<table class="t-table"><thead><tr><th>SKU</th><th>商品</th><th>规格</th><th style="text-align:center">库存</th><th style="text-align:center">在途</th><th style="text-align:center">操作</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function adjTransit(sku,delta){
  var newVal=Math.max(0,(_transitCache[sku]||0)+delta);
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  if(newVal<=0) delete map[sku]; else map[sku]=newVal;
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function receiveOne(sku){
  if(!confirm('确认 '+sku+' 已收货？将从在途中移除。')) return;
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  delete map[sku];
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function deleteTransit(sku){
  if(!confirm('删除 '+sku+' 的在途记录？')) return;
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  delete map[sku];
  _transitCache=map;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

function clearAllTransit(){
  var t=totalTransit();if(t<=0) return;
  if(!confirm('确认全部收货？'+t+'件在途清零。')) return;
  _transitCache={};
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub({});
}

    return '<div class="r-item" data-sku="'+d.sku+'" onclick="selectModalSku(this,\\\''+d.sku+'\\\',\\\''+d.spec.replace(/\\'/g,'\\\\\\\'')+'\\\')"><span>'+d.sku+'</span><span>'+d.title.substr(0,20)+' · '+d.spec+'</span></div>';

function closeTransitAdd(){document.getElementById('addTransitModal').classList.remove('show')}
function selectModalSku(el,sku,spec){
  document.querySelectorAll('#modalResults .r-item').forEach(function(i){i.classList.remove('sel')});
  el.classList.add('sel');_modalSelected=sku;
}
function filterModal(q){
  var lo=q.toLowerCase();
  document.querySelectorAll('#modalResults .r-item').forEach(function(i){
    i.style.display=i.textContent.toLowerCase().indexOf(lo)>=0?'':'none';
  });
}
function confirmTransitAdd(){
  if(!_modalSelected){alert('请先选择一个 SKU');return}
  var qty=parseInt(document.getElementById('modalQty').value)||1;
  var map={};for(var k in _transitCache)map[k]=_transitCache[k];
  map[_modalSelected]=(map[_modalSelected]||0)+qty;
  _transitCache=map;
  closeTransitAdd();
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(map);
}

// ====== 刷新 ======
function refreshAll(){
  var groups=groupByInv();
  renderDashboard(groups);
  renderCards(groups,'all','');
  currentFilter='all';currentSearch='';
  document.querySelectorAll('#filterBar .filter-tag').forEach(function(t,i){t.classList.toggle('active',i===0)});
}
