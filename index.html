<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 顺运宝 · 实时库存看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f6f8;--card-bg:#fff;--border:rgba(0,0,0,.06);
  --text:#1a1a2e;--muted:#6b7280;--dim:#d1d5db;
  --cyan:#0891b2;--green:#059669;--yellow:#d97706;--red:#dc2626;--purple:#7c3aed;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1300px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tab{padding:10px 24px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .25s;position:relative;letter-spacing:.5px}
.tab:hover{color:var(--cyan)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab .badge{display:inline-block;background:rgba(8,145,178,.1);color:var(--cyan);border-radius:10px;padding:1px 8px;font-size:10px;margin-left:6px;font-weight:700}

.page{display:none}
.page.active{display:block}

/* Sync status */
.sync-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;font-size:11px;margin-bottom:12px;font-weight:500}
.sync-bar.synced,.sync-bar.syncing{background:rgba(5,150,105,.06);border:1px solid rgba(5,150,105,.15);color:var(--green)}
.sync-bar.local{background:rgba(217,119,6,.06);border:1px solid rgba(217,119,6,.15);color:var(--yellow)}
.sync-bar.error{background:rgba(220,38,38,.05);border:1px solid rgba(220,38,38,.15);color:var(--red)}
.sync-bar .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-bar.synced .sync-dot{background:var(--green)}
.sync-bar.syncing .sync-dot{background:var(--cyan);animation:pulse-dot .8s infinite}
.sync-bar.local .sync-dot{background:var(--yellow)}
.sync-bar.error .sync-dot{background:var(--red)}
.sync-bar small{opacity:.6;font-size:10px}

/* Stats */
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 18px;text-align:center;flex:1;min-width:70px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .3s}
.stat:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat .num{font-size:24px;font-weight:700;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;letter-spacing:-1px}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}

/* Filter */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-tag{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:500;background:#fff;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;user-select:none}
.filter-tag.active,.filter-tag:hover{background:rgba(8,145,178,.06);border-color:rgba(8,145,178,.2);color:var(--cyan)}
.search-box{flex:1;min-width:140px}
.search-box input{width:100%;background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 16px;color:var(--text);font-size:11px;outline:none}
.search-box input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(8,145,178,.1)}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}
@media(max-width:480px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .3s;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card:hover{border-color:rgba(8,145,178,.2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.08),0 0 0 1px rgba(8,145,178,.1)}
.card.has-out{border-top:2px solid var(--red);box-shadow:0 0 15px rgba(220,38,38,.08)}
.card.has-low{border-top:2px solid var(--yellow);box-shadow:0 0 15px rgba(217,119,6,.08)}
.card-img{width:100%;aspect-ratio:1;background:#f1f3f5;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.card-img::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.03))}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.card-img .ph{font-size:44px;opacity:.08;position:relative}
.card-img .stock-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;z-index:2}
.card-img .stock-dot.critical{background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse-dot 1.5s infinite}
.card-img .stock-dot.low{background:var(--yellow);box-shadow:0 0 10px var(--yellow);animation:pulse-dot 2s infinite}
.card-img .stock-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.card-body{flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.card-inv{font-size:11px;color:var(--cyan);font-weight:700;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;cursor:pointer}
.card-inv:hover{opacity:.7}
.card-title{font-size:11px;color:#4b5563;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec-tag{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:4px;font-size:10px;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;background:rgba(5,150,105,.06);border:1px solid rgba(5,150,105,.15);color:var(--green)}
.spec-tag.out{background:rgba(220,38,38,.05);border-color:rgba(220,38,38,.2);color:var(--red)}
.spec-tag.low{background:rgba(217,119,6,.05);border-color:rgba(217,119,6,.2);color:var(--yellow)}
.spec-tag .n{font-weight:700}
.spec-tag i{font-style:normal;opacity:.25;margin:0 3px}
.spec-tag.transit{border-color:var(--cyan);box-shadow:0 0 6px rgba(8,145,178,.4),0 0 14px rgba(8,145,178,.15);animation:transit-glow 2s ease-in-out infinite}
@keyframes transit-glow{0%,100%{box-shadow:0 0 4px rgba(8,145,178,.3),0 0 10px rgba(8,145,178,.1)}50%{box-shadow:0 0 8px rgba(8,145,178,.6),0 0 20px rgba(8,145,178,.2)}}
.card-footer{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:10px}
.total-stock{color:var(--muted);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.transit-hint{color:var(--yellow);font-weight:600;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.replenish-tag{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.replenish-tag.need{background:rgba(217,119,6,.08);color:var(--yellow);border:1px solid rgba(217,119,6,.2)}
.replenish-tag.ok{background:rgba(5,150,105,.05);color:var(--green);border:1px solid rgba(5,150,105,.12)}

/* Charts */
.chart-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:700px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chart-card h3{font-size:11px;color:var(--cyan);margin-bottom:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.bar-list{display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:6px;font-size:10px}
.bar-label{width:62px;text-align:right;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;font-size:9px}
.bar-track{flex:1;height:10px;background:#f1f3f5;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.04)}
.bar-fill{height:100%;border-radius:5px;transition:width .6s ease}
.bar-fill.danger{background:linear-gradient(90deg,rgba(220,38,38,.5),var(--red))}
.bar-fill.warn{background:linear-gradient(90deg,rgba(217,119,6,.5),var(--yellow))}
.bar-fill.ok{background:linear-gradient(90deg,rgba(8,145,178,.5),var(--cyan))}
.bar-fill.sales{background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 8px rgba(124,58,237,.15)}
.bar-val{width:36px;font-size:9px;color:var(--muted);text-align:right;flex-shrink:0;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.donut-list{display:flex;flex-direction:column;gap:7px}
.donut-row{display:flex;align-items:center;gap:10px;font-size:11px}
.donut-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.donut-num{font-weight:700;color:var(--text);min-width:22px;text-align:right;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.donut-pct{color:var(--muted);font-size:10px;margin-left:auto;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}

/* ====== 在途页 - 包裹分组 ====== */
.transit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.transit-head h2{font-size:17px;font-weight:700;color:var(--cyan);letter-spacing:1px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;border:none;font-weight:600;transition:all .2s;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;letter-spacing:.5px}
.btn-add{background:var(--yellow);color:#fff;box-shadow:0 0 12px rgba(217,119,6,.15)}
.btn-add:hover{box-shadow:0 0 20px rgba(217,119,6,.25);transform:translateY(-1px)}
.btn-clear{background:rgba(220,38,38,.05);color:var(--red);border:1px solid rgba(220,38,38,.2)}
.btn-clear:hover{background:rgba(220,38,38,.08);box-shadow:0 0 10px rgba(220,38,38,.1)}

.t-summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.t-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 20px;flex:1;min-width:100px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.t-stat .tnum{font-size:26px;font-weight:700;color:var(--cyan);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.t-stat .tlbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}

/* Package Card */
.pkg-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03);transition:all .2s}
.pkg-card:hover{border-color:rgba(8,145,178,.15)}
.pkg-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;transition:background .15s}
.pkg-header:hover{background:rgba(8,145,178,.02)}
.pkg-toggle{font-size:10px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.pkg-card.open .pkg-toggle{transform:rotate(90deg)}
.pkg-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.pkg-name{font-size:13px;font-weight:600;color:var(--text);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkg-name:hover{color:var(--cyan)}
.pkg-name-edit{font-size:13px;font-weight:600;color:var(--cyan);background:#fff;border:1px solid var(--cyan);border-radius:6px;padding:2px 8px;width:200px;font-family:inherit;outline:none}
.pkg-date{font-size:10px;color:var(--muted);margin-top:1px;cursor:pointer;display:inline-block}
.pkg-date:hover{color:var(--cyan)}
.pkg-date-edit{font-size:10px;background:#fff;border:1px solid var(--cyan);border-radius:4px;padding:1px 6px;color:var(--cyan);outline:none;width:140px}
.pkg-summary{font-size:10px;color:var(--muted);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;white-space:nowrap}
.pkg-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.pkg-rec-btn{padding:5px 14px;border-radius:6px;border:1px solid rgba(5,150,105,.2);background:rgba(5,150,105,.05);color:var(--green);font-size:10px;cursor:pointer;font-weight:600;transition:all .15s;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.pkg-rec-btn:hover{background:rgba(5,150,105,.12);box-shadow:0 0 8px rgba(5,150,105,.15)}
.pkg-copy-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(124,58,237,.2);background:rgba(124,58,237,.05);color:var(--purple);font-size:10px;cursor:pointer;font-weight:600;transition:all .15s;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.pkg-copy-btn:hover{background:rgba(124,58,237,.12);box-shadow:0 0 8px rgba(124,58,237,.15)}
.pkg-del-btn{color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;transition:all .15s}
.pkg-del-btn:hover{color:var(--red)}

.pkg-body{display:none;border-top:1px solid var(--border)}
.pkg-card.open .pkg-body{display:block}
.pkg-table{width:100%;border-collapse:collapse;font-size:11px}
.pkg-table th{text-align:left;padding:6px 14px;color:var(--muted);font-weight:500;font-size:10px;border-bottom:1px solid var(--border);background:#fafbfc}
.pkg-table td{padding:8px 14px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
.pkg-table .sku-link{color:var(--cyan);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;font-size:10px;cursor:pointer}
.pkg-table .sku-link:hover{opacity:.7}
/* Transit item thumbnail */
.transit-thumb{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#f3f4f6;flex-shrink:0;position:relative}
.transit-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.transit-thumb-fallback{font-size:12px;color:#4b5563;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Quantity control */
.qty-ctrl{display:inline-flex;align-items:center;gap:6px}
.qty-ctrl .qc-btn{
  width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(8,145,178,.25);
  background:#fff;color:var(--cyan);cursor:pointer;font-size:16px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
  flex-shrink:0;padding:0;user-select:none
}
.qty-ctrl .qc-btn:hover{background:rgba(8,145,178,.08);border-color:var(--cyan)}
.qty-ctrl .qc-btn:active{transform:scale(.92)}
.qty-ctrl .qc-num{
  width:46px;height:26px;text-align:center;font-size:14px;font-weight:700;color:var(--cyan);
  background:#f5f6f8;border:1px solid var(--border);border-radius:6px;padding:0;
  font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;outline:none;
  -moz-appearance:textfield;box-sizing:border-box;vertical-align:middle
}
.qty-ctrl .qc-num:focus{border-color:var(--cyan)}
.qty-ctrl .qc-num::-webkit-outer-spin-button,.qty-ctrl .qc-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty-state p{font-size:12px}

/* ====== 补货预测 ====== */
.replen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.replen-head h2{font-size:17px;font-weight:700;color:var(--cyan);letter-spacing:1px}
.tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:700px){.tiers{grid-template-columns:1fr}}
.tier-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.tier-card .tier-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tier-card .tier-rule{font-size:10px;color:var(--muted);font-family:monospace}
.tier-card .tier-count{font-size:22px;font-weight:700;font-family:monospace;margin:6px 0 2px}
.tier-card.a{border-color:rgba(220,38,38,.2)}.tier-card.a .tier-count{color:var(--red)}
.tier-card.b{border-color:rgba(217,119,6,.2)}.tier-card.b .tier-count{color:var(--yellow)}
.tier-card.c{border-color:rgba(8,145,178,.15)}.tier-card.c .tier-count{color:var(--cyan)}
.rep-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.rep-table th{text-align:left;padding:7px 10px;color:var(--cyan);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.rep-table td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.04)}
.rep-table tr:hover{background:rgba(8,145,178,.02)}
.rep-table .tier-badge{display:inline-block;width:18px;height:18px;border-radius:4px;text-align:center;line-height:18px;font-size:9px;font-weight:700;font-family:monospace}
.rep-table .tier-badge.a{background:rgba(220,38,38,.08);color:var(--red)}
.rep-table .tier-badge.b{background:rgba(217,119,6,.08);color:var(--yellow)}
.rep-table .tier-badge.c{background:rgba(8,145,178,.06);color:var(--cyan)}
.total-bar{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.total-bar .big{font-size:18px;font-weight:700;font-family:monospace;color:var(--cyan)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;width:420px;max-width:90vw;box-shadow:0 4px 32px rgba(0,0,0,.12)}
.modal-box h3{font-size:15px;margin-bottom:12px;color:var(--cyan);letter-spacing:.5px}
.modal-box .search{width:100%;background:#f5f6f8;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:12px;outline:none;margin-bottom:6px}
.modal-box .search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
.modal-box .results{max-height:160px;overflow-y:auto;margin-bottom:4px}
.modal-box .r-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.modal-box .r-item:hover{background:rgba(8,145,178,.04);color:var(--text)}
.modal-box .r-item.sel{background:rgba(217,119,6,.06);color:var(--yellow);border:1px solid rgba(217,119,6,.15)}
.modal-box .field-row{display:flex;gap:10px;margin-top:8px;align-items:center}
.modal-box .field-row label{font-size:11px;color:var(--muted);white-space:nowrap}
.modal-box .field-row input,.modal-box .field-row select{flex:1;background:#f5f6f8;border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none}
.modal-box .field-row select{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;font-size:11px}
.modal-box .field-row input:focus,.modal-box .field-row select:focus{border-color:var(--cyan)}
.modal-box .qty-row input{width:70px;text-align:center;font-size:16px;font-weight:700;color:var(--cyan);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;flex:none}
.modal-box .added-list{margin-top:10px;max-height:120px;overflow-y:auto}
.modal-box .added-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:rgba(8,145,178,.03);margin-bottom:4px;font-size:11px}
.modal-box .added-item .sku{color:var(--cyan);font-weight:600;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.modal-box .added-item .qty{color:var(--text);font-weight:700}
.modal-box .added-item .remove{color:var(--muted);cursor:pointer;margin-left:auto;font-size:14px;padding:0 4px}
.modal-box .added-item .remove:hover{color:var(--red)}
.modal-box .btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal-box button{padding:8px 18px;border-radius:8px;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-save{background:var(--cyan);color:#fff}
.btn-cancel{background:#f1f3f5;color:var(--muted)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#fff;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 16px rgba(8,145,178,.2)}
.toast.show{opacity:1}

footer{text-align:center;padding:24px 0 10px;font-size:10px;color:var(--dim);font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;letter-spacing:1px}
footer a{color:var(--dim);text-decoration:none}

/* Pwd */
.pwd-overlay{display:flex;position:fixed;inset:0;background:#f5f6f8;z-index:9999;justify-content:center;align-items:center;flex-direction:column}
.pwd-overlay.hidden{display:none}
.pwd-box{text-align:center}
.pwd-box h2{font-size:24px;color:var(--cyan);margin-bottom:8px;letter-spacing:2px}
.pwd-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.pwd-box input{width:260px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 20px;color:var(--cyan);font-size:18px;outline:none;text-align:center;letter-spacing:6px;font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace}
.pwd-box input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
.pwd-box .pwd-err{color:var(--red);font-size:12px;margin-top:12px;min-height:18px}
.pwd-box .pwd-shake{animation:pwdShake .4s ease}
@keyframes pwdShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>

<!-- 密码门禁 -->
<div class="pwd-overlay" id="pwdOverlay">
  <div class="pwd-box">
    <h2>🔒 库存看板</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pwdInput" placeholder="······" onkeydown="if(event.key==='Enter')checkPwd()" autofocus>
    <div class="pwd-err" id="pwdErr"></div>
  </div>
</div>

<div class="container">
  <!-- Sync status -->
  <div class="sync-bar" id="syncBar"><span class="sync-dot"></span><span id="syncMsg">加载中...</span></div>
  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-page="dash">📦 库存看板</div>
    <div class="tab" data-page="replen">📋 补货预测</div>
    <div class="tab" data-page="transit">🚚 在途管理<span class="badge" id="transitBadge">0</span></div>
  </div>

  <!-- ═══ 库存看板 ═══ -->
  <div class="page active" id="page-dash">
    <div class="stats-row" id="statsRow"></div>
    <div class="chart-row" id="chartRow">
      <div class="chart-card"><h3>🚨 急补货 Top 10</h3><div class="bar-list" id="restockBars"></div></div>
      <div class="chart-card"><h3>🔥 销售 Top 10</h3><div class="bar-list" id="salesBars"></div></div>
      <div class="chart-card"><h3>📊 库存分布</h3><div class="donut-list" id="statusDonut"></div></div>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="card-grid" id="cardGrid"></div>
    <footer>顺运宝 · 库存监控系统 · 数据自动同步</footer>
  </div>

  <!-- ═══ 在途管理（包裹分组） ═══ -->
  <div class="page" id="page-transit">
    <div class="transit-head">
      <h2>🚚 在途管理</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-add" onclick="openTransitAdd()">+ 添加在途</button>
        <button class="btn btn-clear" onclick="clearAllTransit()">全部收货</button>
      </div>
    </div>
    <div class="t-summary" id="transitSummary"></div>
    <div id="transitPackages"></div>
  </div>

  <!-- ═══ 补货预测 ═══ -->
  <div class="page" id="page-replen">
    <div class="replen-head">
      <h2>📋 补货预测</h2>
      <span style="font-size:12px;color:var(--muted);font-family:monospace">公式: 建议采购 = 日均销量 × (补货周期 + 安全天数)</span>
    </div>
    <div class="tiers" id="tierCards"></div>
    <div class="search-box" style="margin-bottom:10px"><input type="text" id="replenSearch" placeholder="搜索 SKU / 商品名称 / 规格..." oninput="filterReplen()"></div>
    <div id="replenTable"></div>
    <div class="total-bar" id="replenTotal"></div>
  </div>
</div>

<!-- 添加在途弹窗 -->
<div class="modal-overlay" id="addTransitModal">
  <div class="modal-box">
    <h3>+ 添加在途</h3>
    <input class="search" placeholder="搜索 SKU / 商品名..." oninput="filterModal(this.value)">
    <div class="results" id="modalResults"></div>
    <div class="added-list" id="modalAdded"></div>
    <div class="field-row">
      <label>包裹名</label>
      <select id="modalPkgName" onchange="onPkgNameChange()">
        <option value="">+ 新建包裹</option>
      </select>
    </div>
    <div class="field-row" id="newPkgRow">
      <label>新名称</label>
      <input type="text" id="modalNewPkg" placeholder="如：6月5日发货">
    </div>
    <div class="field-row">
      <label>日期</label>
      <input type="date" id="modalDate">
    </div>
    <div class="btns">
      <button class="btn-cancel" onclick="closeTransitAdd()">取消</button>
      <button class="btn-save" onclick="confirmTransitAdd()">添加</button>
    </div>
  </div>
</div>

async function sha256(m){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');}

var TRANSIT_API = 'https://api.github.com/repos/Jacksoneaton/stock-dashboard/contents/in_transit.json';
var TRANSIT_RAW  = 'https://raw.githubusercontent.com/Jacksoneaton/stock-dashboard/gh-pages/in_transit.json';
var TOKEN_KEY='***';
var _transitData = [];  // [{id, name, date, items: {sku: qty}}]
var _transitSha=null;
var _transitReady=false;

(function(){
  _ghToken=localStorage.getItem(TOKEN_KEY)||_ghToken;

  refreshAll();

function uuid(){return 'pkg_'+Date.now() + '_' + Math.random().toString(36).slice(2,8);}

function loadTransit(cb){
  // localStorage 是主数据源，GitHub 是备份
  try{
    var local=localStorage.getItem('hermes_transit');
    if(local){_transitData=JSON.parse(local);}
  }catch(e){}
  var localCopy=_transitData.slice();  // 备份一下，后续比较用
  
  // 异步从 GitHub 拉取（仅做参考，不覆盖更多数据的本地版本）
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_RAW+'?t='+Date.now());x.timeout=8000;
  x.onload=function(){
    if(x.status===200){
      try{
        var raw=JSON.parse(x.responseText)||{};
        if(raw.packages && Array.isArray(raw.packages)){
          var remote=raw.packages;
          var localCount=localCopy.reduce(function(s,p){for(var k in p.items)s+=p.items[k];return s},0);
          var remoteCount=remote.reduce(function(s,p){for(var k in p.items)s+=p.items[k];return s},0);
          // 只有 GitHub 数据更多时才更新本地（说明其他设备有新增）
          if(remoteCount>localCount||localCopy.length===0){
            _transitData=remote;
            localStorage.setItem('hermes_transit',JSON.stringify(remote));
            setSyncStatus('synced','已同步 · GitHub');
            refreshAll();
          }else if(localCount>remoteCount){
            // 本地有未上传的数据 → 自动推送到 GitHub
            _transitData=localCopy;
            saveTransitToGitHub(localCopy);
            setSyncStatus('synced','恢复同步 · 已上传');
            refreshAll();
          }else{
            setSyncStatus('synced','已同步 · 一致');
          }
        }
      }catch(e){setSyncStatus('local','离线模式 · 本地数据')}
    }else{setSyncStatus('local','离线模式 · 本地数据')}
    cb();
  };
  x.onerror=function(){setSyncStatus('local','离线模式 · 本地数据');cb()};
  x.ontimeout=function(){setSyncStatus('local','离线模式 · 本地数据');cb()};
  x.send();
}

// 按 SKU 汇总所有包裹的在途数量（给看板卡片用）
function getTransit(sku){
  var t=0;
  _transitData.forEach(function(p){
    t+=p.items[sku]||0;
  });
  return t;
}
function totalTransit(){
  var t=0;
  _transitData.forEach(function(p){
    for(var k in p.items) t+=p.items[k];
  });
  return t;
}

function saveTransitToGitHub(data,cb){
  // 先存localStorage，保证刷新不丢
  try{localStorage.setItem('hermes_transit',JSON.stringify(data));}catch(e){}
  
  if(!_ghToken){setSyncStatus('local','未配置Token');if(cb)cb(false);return}
  setSyncStatus('syncing','同步中...');
  var c=JSON.stringify({packages:data});
  var p={message:'Update in_transit.json',content:btoa(unescape(encodeURIComponent(c))),branch:'gh-pages'};
  if(_transitSha) p.sha=_transitSha;
  var x=new XMLHttpRequest();
  x.open('PUT',TRANSIT_API);x.timeout=15000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){
    if(x.status===200||x.status===201){
      var r=JSON.parse(x.responseText);_transitSha=r.content.sha;
      setSyncStatus('synced','已同步 · GitHub');
      if(cb) cb(true);
    }else if(x.status===422){fetchShaAndRetry(data,cb)}
    else{setSyncStatus('error','同步失败 · 仅本地保存');if(cb)cb(false)}
  };
  x.onerror=function(){setSyncStatus('error','网络异常 · 仅本地保存');if(cb)cb(false)};
  x.ontimeout=function(){setSyncStatus('error','同步超时 · 仅本地保存');if(cb)cb(false)};
  x.send(JSON.stringify(p));
}
function fetchShaAndRetry(data,cb){
  var x=new XMLHttpRequest();
  x.open('GET',TRANSIT_API+'?ref=gh-pages');x.timeout=8000;
  x.setRequestHeader('Authorization','token '+_ghToken);
  x.setRequestHeader('User-Agent','hermes-dashboard');
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.onload=function(){if(x.status===200){_transitSha=JSON.parse(x.responseText).sha;saveTransitToGitHub(data,cb)}else{if(cb) cb(false)}};
  x.onerror=function(){if(cb) cb(false)};
  x.send();
}

// ====== 看板渲染 ======
function groupByInv(){
  var groups={},order=[];
  DATA.forEach(function(d){
    var key=d.invCode||d.sku;
    if(!groups[key]){groups[key]={invCode:key,title:d.title,img:d.img||'',specs:[],stock:0};order.push(key)}
    groups[key].specs.push(d);
    groups[key].stock+=d.stock;
  });
  return order.map(function(k){return groups[k]});
}

function specState(d){
  if(d.stock===0) return 'out';
  if(d.stock<=3) return 'low';
  return 'ok';
}
function cardState(specs){
  var hasOut=specs.some(function(s){return s.stock===0});
  if(hasOut) return 'has-out';
  var hasLow=specs.some(function(s){return s.stock>0&&s.stock<=3});
  if(hasLow) return 'has-low';
  return '';
}

function renderDashboard(groups){
  var total=DATA.length,out=0,low=0,tran=totalTransit();
  DATA.forEach(function(d){if(d.stock===0)out++;else if(d.stock<=3)low++});
  document.getElementById('statsRow').innerHTML=
    '<div class="stat"><div class="num" style="color:var(--blue)">'+total+'</div><div class="lbl">SKU</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--red)">'+out+'</div><div class="lbl">缺货</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--yellow)">'+low+'</div><div class="lbl">低库存</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--green)">'+(total-out-low)+'</div><div class="lbl">正常</div></div>'+
    '<div class="stat"><div class="num" style="color:var(--yellow)">'+tran+'</div><div class="lbl">🚚 在途</div></div>';
  document.getElementById('filterBar').innerHTML=
    '<div class="filter-tag active" onclick="setFilter(this,\'all\')">全部 '+total+'</div>'+

}

function renderCharts(){
  var items=DATA.map(function(d){
    var rep=REPLENISH[d.sku]||{};
    return {sku:d.sku,stock:d.stock,daily:rep.daily||0,suggest:rep.suggest||0};
  });
  var restock=items.filter(function(s){return s.daily>0;}).map(function(s){
    return {sku:s.sku,days:Math.round(s.stock/s.daily*10)/10,suggest:s.suggest};
  }).sort(function(a,b){return a.days-b.days;}).slice(0,10);
  var maxDays=Math.max.apply(null,restock.map(function(s){return s.days;}).concat([1]));
  var restockHtml='';
  restock.forEach(function(s){
    var pct=Math.max(3,(s.days/maxDays)*100);
    var cls=s.days<1?'danger':s.days<3?'warn':'ok';
    restockHtml+='<div class="bar-row"><span class="bar-label">'+s.sku+'</span><div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+pct+'%"></div></div><span class="bar-val">'+s.days+'天</span></div>';
  });
  document.getElementById('restockBars').innerHTML=restockHtml||'<span style="color:var(--dim);font-size:11px">暂无数据</span>';
  var sales=items.filter(function(s){return s.daily>0;}).sort(function(a,b){return b.daily-a.daily;}).slice(0,10);
  var maxDaily=Math.max.apply(null,sales.map(function(s){return s.daily;}).concat([1]));
  var salesHtml='';
  sales.forEach(function(s){
    var pct=Math.max(3,(s.daily/maxDaily)*100);
    salesHtml+='<div class="bar-row"><span class="bar-label">'+s.sku+'</span><div class="bar-track"><div class="bar-fill sales" style="width:'+pct+'%"></div></div><span class="bar-val">'+s.daily+'/天</span></div>';
  });
  document.getElementById('salesBars').innerHTML=salesHtml||'<span style="color:var(--dim);font-size:11px">暂无数据</span>';
  var withSales=items.filter(function(s){return s.daily>0;});
  var buckets=[{label:'<3天',color:'var(--red)',min:0,max:3},{label:'3~7天',color:'var(--yellow)',min:3,max:7},{label:'7~14天',color:'var(--blue)',min:7,max:14},{label:'>14天',color:'var(--green)',min:14,max:9999}];
  var donutHtml='';
  buckets.forEach(function(b){
    var n=withSales.filter(function(s){var days=s.daily>0?Math.round(s.stock/s.daily*10)/10:999;return days>=b.min&&days<b.max;}).length;
    var pct=withSales.length>0?Math.round(n/withSales.length*100):0;
    donutHtml+='<div class="donut-row"><div class="donut-dot" style="background:'+b.color+'"></div><span style="color:var(--muted)">'+b.label+'</span><span class="donut-num">'+n+'</span><span class="donut-pct">'+pct+'%</span></div>';
  });
  document.getElementById('statusDonut').innerHTML=donutHtml||'<span style="color:var(--dim);font-size:11px">暂无数据</span>';
}

function renderCards(groups,filter,search){
  var html='';
  groups.forEach(function(g){
    var specs=g.specs;
    if(filter==='out'&&!specs.some(function(s){return s.stock===0})) return;
    if(filter==='low'&&!specs.some(function(s){return s.stock>0&&s.stock<=3})) return;
    if(search){
      var lo=search.toLowerCase();
      if(g.invCode.toLowerCase().indexOf(lo)===-1&&g.title.toLowerCase().indexOf(lo)===-1&&!specs.some(function(s){return s.sku.toLowerCase().indexOf(lo)>-1})) return;
    }
    var specsHtml=specs.map(function(s){
      var cls=specState(s);if(getTransit(s.sku)>0) cls+=' transit';return '<span class="spec-tag '+cls+'">'+s.spec+'<i>|</i><span class="n">'+s.stock+'</span></span>';
    }).join('');
    var imgHtml='';
    if(g.img) imgHtml='<img src="'+g.img+'" onerror="this.style.display=\'none\'" alt="">';
    else imgHtml='<div class="ph">'+getIcon(g.title)+'</div>';
    var dotCls='';
    if(specs.some(function(s){return s.stock===0})) dotCls='critical';
    else if(specs.some(function(s){return s.stock>0&&s.stock<=3})) dotCls='low';
    else dotCls='ok';
    var cs=cardState(specs);
    var transitSkus=specs.filter(function(s){return getTransit(s.sku)>0}).length;
    var repTotal=specs.reduce(function(sum,s){
      var r=REPLENISH[s.sku];return sum+(r&&r.suggest?r.suggest:0);
    },0);
    html+='<div class="card '+cs+'">'+
      '<div class="card-img">'+imgHtml+'<div class="stock-dot '+dotCls+'"></div></div>'+
      '<div class="card-body">'+
        '<div class="card-inv" onclick="copyText(\''+g.invCode+'\')" title="点击复制">'+g.invCode+'</div>'+
        '<div class="card-title">'+g.title+'</div>'+
        '<div class="specs">'+specsHtml+'</div>'+
        '<div class="card-footer">'+
          '<span class="total-stock">📦 '+g.stock+'件 · '+specs.length+'规格</span>'+
          (transitSkus>0?'<span class="transit-hint">🚚 '+transitSkus+'个有在途</span>':'')+
          (repTotal>0?'<span class="replenish-tag need">⚠️ 补'+repTotal+'件</span>':'<span class="replenish-tag ok">✓ 够用</span>')+
        '</div>'+
      '</div></div>';
  });
  document.getElementById('cardGrid').innerHTML=html||'<div style="text-align:center;color:var(--dim);padding:40px">无匹配商品</div>';
}

function startEditName(id, name){

  el.outerHTML='<input class="pkg-name-edit" value="'+name.replace(/"/g,'&quot;')+'" id="edit-name-'+id+'" onkeydown="if(event.key===\'Enter\')savePkgEdit(\''+id+'\')" onblur="savePkgEdit(\''+id+'\')" onclick="event.stopPropagation()">';
  var inp=document.getElementById('edit-name-'+id);
  inp.focus();inp.select();

function startEditDate(id, date){
  var el=event.target;
  el.outerHTML='<input type="date" class="pkg-date-edit" value="'+date+'" id="edit-date-'+id+'" onchange="savePkgEdit(\''+id+'\')" onclick="event.stopPropagation()">';
  document.getElementById('edit-date-'+id).focus();

function savePkgEdit(id){
  var data=JSON.parse(JSON.stringify(_transitData));
  var pkg=data.find(function(p){return p.id===id});
  if(!pkg) return;
  var nameEl=document.getElementById('edit-name-'+id);
  var dateEl=document.getElementById('edit-date-'+id);
  if(nameEl) pkg.name=nameEl.value.trim()||pkg.name;
  if(dateEl) pkg.date=dateEl.value||pkg.date;
  _transitData=data;
  renderTransitTab();
  saveTransitToGitHub(data);
  showToast('已更新');
}

function adjTransitInPkg(pkgId,sku,delta){
  var data=JSON.parse(JSON.stringify(_transitData));
  var pkg=data.find(function(p){return p.id===pkgId});
  if(!pkg) return;
  pkg.items[sku]=(pkg.items[sku]||0)+delta;
  if(pkg.items[sku]<=0) delete pkg.items[sku];
  // 如果包裹为空则删除包裹
  if(Object.keys(pkg.items).length===0){
    data=data.filter(function(p){return p.id!==pkgId});
  }
  _transitData=data;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

function setTransitQty(pkgId,sku,val){
  var v=parseInt(val)||0;
  if(v<0) v=0;
  var data=JSON.parse(JSON.stringify(_transitData));
  var pkg=data.find(function(p){return p.id===pkgId});
  if(!pkg) return;
  if(v===0){delete pkg.items[sku]}
  else{pkg.items[sku]=v}
  if(Object.keys(pkg.items).length===0) data=data.filter(function(p){return p.id!==pkgId});
  _transitData=data;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

function receivePackage(pkgId){
  if(!confirm('确认该包裹已全部收货？将从在途中移除。')) return;
  var data=_transitData.filter(function(p){return p.id!==pkgId});
  _transitData=data;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

function deletePackage(pkgId){
  if(!confirm('删除该包裹的全部在途记录？')) return;
  var data=_transitData.filter(function(p){return p.id!==pkgId});
  _transitData=data;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

function copyPackageInfo(pkgId){
  var pkg=_transitData.find(function(p){return p.id===pkgId});
  if(!pkg) return;
  var skuInfo={};
  DATA.forEach(function(d){skuInfo[d.sku]={title:d.title,spec:d.spec};});
  var lines=['📦 '+pkg.name,'日期: '+pkg.date,''];
  for(var sku in pkg.items){
    var info=skuInfo[sku]||{title:'?',spec:'?'};
    lines.push(sku+'  '+info.title+'('+info.spec+')  ×'+pkg.items[sku]);
  }
  var text=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){showToast('已复制包裹信息')});}
  else{showToast('复制失败，请手动复制')}
}

function deleteTransitItem(pkgId,sku){
  var data=JSON.parse(JSON.stringify(_transitData));
  var pkg=data.find(function(p){return p.id===pkgId});
  if(!pkg) return;
  delete pkg.items[sku];
  if(Object.keys(pkg.items).length===0){
    data=data.filter(function(p){return p.id!==pkgId});
  }
  _transitData=data;
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

function clearAllTransit(){
  var t=totalTransit();if(t<=0) return;
  if(!confirm('确认全部包裹已收货？共 '+t+' 件在途清零。')) return;
  _transitData=[];
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub([]);
}

function confirmTransitAdd(){
  if(_modalAdded.length===0){alert('请先选择至少一个 SKU');return}
  var pkgName=document.getElementById('modalPkgName').value || document.getElementById('modalNewPkg').value.trim();
  if(!pkgName){alert('请输入包裹名称');return}

  var items={};
  _modalAdded.forEach(function(i){items[i.sku]=i.qty;});

  var data=JSON.parse(JSON.stringify(_transitData));

  // 如果选择已有包裹名 → 合并到该包裹
  if(document.getElementById('modalPkgName').value){
    var existing=data.find(function(p){return p.name===pkgName});
    if(existing){
      for(var sku in items){
        existing.items[sku]=(existing.items[sku]||0)+items[sku];
      }
    } else {
      data.push({id:uuid(),name:pkgName,date:document.getElementById('modalDate').value,items:items});
    }
  } else {
    data.push({id:uuid(),name:pkgName,date:document.getElementById('modalDate').value,items:items});
  }

  _transitData=data;
  closeTransitAdd();
  renderTransitTab();
  refreshAll();
  saveTransitToGitHub(data);
}

// ====== 补货预测 Tab ======
var _replenItems=[];
function renderReplenTab(){
  _replenItems=[];
  var items=_replenItems;
  DATA.forEach(function(d){
    var rep=REPLENISH[d.sku]||{};
    if(rep.suggest&&rep.suggest>0){
      items.push({sku:d.sku,title:d.title,spec:d.spec,stock:d.stock,daily:rep.daily||0,suggest:rep.suggest});
    }
  });
  var a=[],b=[],c=[];
  items.forEach(function(i){
    if(i.daily>=3){i.tier='A';a.push(i)}
    else if(i.daily>=1){i.tier='B';b.push(i)}
    else{i.tier='C';c.push(i)}
  });
  document.getElementById('tierCards').innerHTML=
    '<div class="tier-card a"><div class="tier-label">A 级 · 爆款</div><div class="tier-count">'+a.length+'</div><div class="tier-rule">≥3件/天 → 备13天 · 预警4天</div></div>'+
    '<div class="tier-card b"><div class="tier-label">B 级 · 常规</div><div class="tier-count">'+b.length+'</div><div class="tier-rule">1~3件/天 → 备9天 · 预警3天</div></div>'+
    '<div class="tier-card c"><div class="tier-label">C 级 · 慢销</div><div class="tier-count">'+c.length+'</div><div class="tier-rule"><1件/天 → 备7天 · 预警2天</div></div>';
  document.getElementById('replenSearch').value='';
  renderReplenTable(items);
}
function filterReplen(){
  var q=document.getElementById('replenSearch').value.toLowerCase();
  var filtered=_replenItems.filter(function(i){
    return !q||i.sku.toLowerCase().indexOf(q)>-1||i.title.toLowerCase().indexOf(q)>-1||i.spec.toLowerCase().indexOf(q)>-1;
  });
  renderReplenTable(filtered);
}
function renderReplenTable(items){
  if(items.length===0){
    var q=document.getElementById('replenSearch').value.trim();
    document.getElementById('replenTable').innerHTML='<div class="empty-state"><div class="icon">'+(q?'🔍':'✅')+'</div><p>'+(q?'无匹配结果':'所有 SKU 库存充足，无需补货')+'</p></div>';
    document.getElementById('replenTotal').innerHTML='';
    return;
  }
  // 重新计算 ABC 分档
  var a=0,b=0,c=0;
  items.forEach(function(i){if(i.tier==='A')a++;else if(i.tier==='B')b++;else c++;});
  var rows=items.sort(function(x,y){return y.suggest-x.suggest}).map(function(i){
    var days=i.daily>0?Math.round(i.stock/i.daily*10)/10:0;
    var daysStr=days<1?'<span style="color:var(--red)">'+days+'天</span>':days<3?'<span style="color:var(--yellow)">'+days+'天</span>':days+'天';
    return '<tr>'+
      '<td><span class="tier-badge '+(i.tier==='A'?'a':i.tier==='B'?'b':'c')+'">'+i.tier+'</span></td>'+
      '<td style="font-family:monospace;font-size:10px;color:var(--cyan)">'+i.sku+'</td>'+
      '<td style="color:#4b5563;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+i.title+'</td>'+
      '<td style="color:var(--muted)">'+i.spec+'</td>'+
      '<td style="text-align:center;font-family:monospace;font-weight:700;color:'+(i.stock===0?'var(--red)':'var(--text)')+'">'+i.stock+'</td>'+
      '<td style="text-align:center;font-family:monospace">'+i.daily+'</td>'+
      '<td style="text-align:center;font-family:monospace">'+daysStr+'</td>'+
      '<td style="text-align:center;font-family:monospace;font-weight:700;color:var(--yellow)">'+i.suggest+'件</td>'+
    '</tr>';
  }).join('');
  document.getElementById('replenTable').innerHTML=
    '<table class="rep-table"><thead><tr><th>级</th><th>SKU</th><th>商品</th><th>规格</th><th style="text-align:center">库存</th><th style="text-align:center">日均</th><th style="text-align:center">可售</th><th style="text-align:center">建议采购</th></tr></thead><tbody>'+rows+'</tbody></table>';
  var totalSuggest=items.reduce(function(s,i){return s+i.suggest},0);
  document.getElementById('replenTotal').innerHTML=
    '<span>共 <b style="color:var(--cyan)">'+items.length+'</b> 个SKU需补货</span>'+
    '<span class="big">'+totalSuggest+' 件</span>'+
    '<span>A:'+a.length+' · B:'+b.length+' · C:'+c.length+'</span>';
}

function refreshAll(){
  var groups=groupByInv();
  renderDashboard(groups);
  renderCards(groups,'all','');
  currentFilter='all';currentSearch='';
  document.querySelectorAll('#filterBar .filter-tag').forEach(function(t,i){t.classList.toggle('active',i===0)});
}
</script>
