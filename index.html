var total = D.length;
var allStock = 0;
var zeroCount = 0;
var lowCount = 0;
var prodSet = {};
var availCount = 0;
for (var i = 0; i < D.length; i++) {
  allStock += D[i].k;
  if (D[i].k === 0) zeroCount++;
  else if (D[i].k <= 3) lowCount++;
  prodSet[D[i].c] = 1;
  if (D[i].k > 0) availCount++;
}
var prodCount = Object.keys(prodSet).length;

var html = '';
html += '<div class="scard"><div class="l">总 SKU</div><div class="v">' + total + '</div><div class="s">' + prodCount + ' 款商品</div></div>';
html += '<div class="scard"><div class="l">可用库存</div><div class="v">' + allStock + '</div><div class="s">合计可发货</div></div>';
html += '<div class="scard"><div class="l">预警数量</div><div class="v">' + (zeroCount + lowCount) + '</div><div class="s">缺货 ' + zeroCount + ' · 低库存 ' + lowCount + '</div></div>';
html += '<div class="scard"><div class="l">有货率</div><div class="v">' + Math.round(availCount / total * 100) + '%</div><div class="s">' + availCount + '/' + total + ' 有货</div></div>';
document.getElementById('sg').innerHTML = html;

var statusCounts = {};
for (var i = 0; i < D.length; i++) {
  var s = D[i].x;
  statusCounts[s] = (statusCounts[s] || 0) + 1;
}
var statusKeys = Object.keys(statusCounts).sort();

var sbHtml = '<div class="st sta" onclick="setFilter('')">全部 <span style="opacity:.6;font-size:11px">' + total + '</span></div>';
for (var i = 0; i < statusKeys.length; i++) {
  var k = statusKeys[i];
  sbHtml += '<div class="st" onclick="setFilter('' + k + '')">' + k + ' <span style="opacity:.6;font-size:11px">' + statusCounts[k] + '</span></div>';
}
document.getElementById('stb').innerHTML = sbHtml;

var currentFilter = '';
function setFilter(f) {
  currentFilter = f;
  var els = document.querySelectorAll('.st');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getAttribute('onclick').indexOf("'" + f + "'") > -1 || (f === '' && els[i].getAttribute('onclick').indexOf("('')") > -1)) {
      els[i].className = 'st sta';
    } else {
      els[i].className = 'st';
    }
  }
  renderTable();
}

function renderTable() {
  var sq = document.getElementById('q').value.toLowerCase();
  var fd = [];
  for (var i = 0; i < D.length; i++) {
    var d = D[i];
    if (currentFilter && d.x !== currentFilter) continue;
    if (sq && d.s.toLowerCase().indexOf(sq) < 0 && d.t.toLowerCase().indexOf(sq) < 0 && d.c.toLowerCase().indexOf(sq) < 0) continue;
    fd.push(d);
  }
  
  var h = '';
  for (var i = 0; i < fd.length; i++) {
    var d = fd[i];
    var bc, bi;
    if (d.k === 0) { bc = 'bc'; bi = '🔴'; }
    else if (d.k <= 3) { bc = 'bl'; bi = '🟡'; }
    else { bc = 'bo'; bi = '✅'; }
    
    var scl = 'ch';
    if (d.x === '已入仓') scl += ' chs';
    else if (d.x === '已拆包') scl += ' chu';
    else if (d.x === '已寄出') scl += ' che';
    
    h += '<tr>';
    h += '<td><a href="https://shopee.tw/search?keyword=' + encodeURIComponent(d.s) + '" target="_blank">' + d.s + '</a></td>';
    h += '<td class="tc" title="' + d.t.replace(/'/g, '&#39;') + '">' + d.t + '</td>';
    h += '<td>' + d.p + '</td>';
    h += '<td style="text-align:center"><span class="b ' + bc + '">' + bi + ' ' + d.k + '</span></td>';
    h += '<td style="text-align:center;color:' + (d.r > 0 ? '#fbbf24' : '#6b7280') + '">' + (d.r || '-') + '</td>';
    h += '<td style="text-align:center;font-weight:600">' + d.l + '</td>';
    h += '<td style="text-align:center"><span class="' + scl + '">' + d.x + '</span></td>';
    h += '</tr>';
  }
  document.getElementById('tb').innerHTML = h;
  document.getElementById('tt').textContent = '📋 全部商品明细 (' + fd.length + ')';
}

function rf() { renderTable(); }

function updateTime() {
  var n = new Date();
  var y = n.getFullYear();
  var mo = (n.getMonth()+1).toString().padStart(2,'0');
  var d = n.getDate().toString().padStart(2,'0');
  var h = n.getHours().toString().padStart(2,'0');
  var mi = n.getMinutes().toString().padStart(2,'0');
  document.getElementById('ts').textContent = '📅 ' + y + '-' + mo + '-' + d + ' ' + h + ':' + mi;
}

updateTime();
setInterval(updateTime, 30000);
renderTable();
