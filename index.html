<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 顺运宝 · 实时库存看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e17;color:#e0e6ef;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(56,189,248,.06) 0,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(139,92,246,.05) 0,transparent 60%);pointer-events:none;z-index:0}
.container{max-width:1400px;margin:0 auto;padding:16px;position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-left p{font-size:13px;color:#6b7280;margin-top:4px}
.header-right{display:flex;gap:12px;align-items:center}
.time-badge{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);border-radius:8px;padding:8px 16px;font-size:13px;color:#38bdf8}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent,#38bdf8),transparent)}
.stat-card .label{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:700;color:#fff}
.stat-card .sub{font-size:12px;color:#6b7280;margin-top:4px}
.stat-card .icon{position:absolute;top:16px;right:16px;font-size:24px;opacity:.15}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px}
.chart-card h3{font-size:14px;color:#9ca3af;margin-bottom:16px;font-weight:500}
.status-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.status-tag{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#9ca3af;cursor:pointer;transition:all .2s}
.status-tag.active{background:rgba(56,189,248,.15);border-color:#38bdf8;color:#38bdf8}
.status-tag:hover{border-color:#38bdf8}
.status-tag .count{margin-left:6px;opacity:.6;font-size:11px}
.table-wrap{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden}
.table-wrap .table-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap;gap:8px}
.table-wrap .table-header h3{font-size:14px;color:#9ca3af;font-weight:500}
.table-wrap .table-header input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:#e0e6ef;font-size:13px;width:200px;outline:none}
.table-wrap .table-header input:focus{border-color:#38bdf8}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:12px 16px;color:#6b7280;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.04);position:sticky;top:0;background:#0a0e17;z-index:2}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:background .15s}
tbody tr:hover{background:rgba(56,189,248,.04)}
tbody td{padding:10px 16px;vertical-align:middle}
.stock-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.stock-badge.critical{background:rgba(239,68,68,.15);color:#ef4444}
.stock-badge.low{background:rgba(251,191,36,.15);color:#fbbf24}
.stock-badge.ok{background:rgba(34,197,94,.1);color:#22c55e}
/* ---- 在途 ---- */
.transit-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.transit-badge.received{background:rgba(34,197,94,.1);color:#22c55e;border-color:rgba(34,197,94,.2);animation:transitFlash .5s ease-out}
@keyframes transitFlash{0%{transform:scale(1.4);opacity:.3}60%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
.transit-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#6b7280;cursor:pointer;font-size:10px;transition:all .15s;vertical-align:middle;margin-left:3px}
.transit-btn:hover{background:rgba(56,189,248,.15);border-color:#38bdf8;color:#38bdf8}
.transit-btn.recv:hover{background:rgba(34,197,94,.15);border-color:#22c55e;color:#22c55e}
.transit-btn.del:hover{background:rgba(239,68,68,.12);border-color:#ef4444;color:#ef4444}
.transit-edit-inline{width:44px;background:rgba(255,255,255,.06);border:1px solid #38bdf8;border-radius:5px;color:#fbbf24;font-size:11px;text-align:center;padding:2px 4px;outline:none;font-weight:600}
/* ---- */
.replenish-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.replenish-badge.need{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.replenish-badge.enough{background:rgba(34,197,94,.1);color:#22c55e}
.replenish-badge.nodata{background:rgba(107,114,128,.1);color:#6b7280}
.replenish-badge.none{background:rgba(107,114,128,.06);color:#4b5563}
.status-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:11px;background:rgba(255,255,255,.04);color:#9ca3af}
.status-chip.ship{background:rgba(34,197,94,.1);color:#22c55e}
.status-chip.unpack{background:rgba(251,191,36,.1);color:#fbbf24}
.status-chip.sent{background:rgba(107,114,128,.15);color:#6b7280}
.sku-cell{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#e0e6ef}
.sku-cell .copy-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#6b7280;cursor:pointer;font-size:11px;transition:all .15s;flex-shrink:0}
.sku-cell .copy-btn:hover{background:rgba(56,189,248,.15);border-color:#38bdf8;color:#38bdf8}
.sku-cell .copy-btn.copied{background:rgba(34,197,94,.15);border-color:#22c55e;color:#22c55e}
.title-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#d1d5db}
.spec-cell{font-size:11px;color:#6b7280;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:768px){.title-cell{max-width:100px}.spec-cell{max-width:50px}}
.bar-list{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bar-label{width:90px;text-align:right;color:#9ca3af;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:16px;background:rgba(255,255,255,.04);border-radius:8px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:8px;transition:width .6s ease;min-width:2px}
.bar-fill.danger{background:#ef4444}
.bar-fill.warn{background:#fbbf24}
.bar-fill.ok{background:#38bdf8}
.bar-fill.sales{background:linear-gradient(90deg,#818cf8,#a78bfa)}
.bar-val{width:55px;font-size:10px;color:#6b7280;flex-shrink:0}
.donut-list{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.donut-row{display:flex;align-items:center;gap:10px;font-size:12px}
.donut-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.donut-num{font-weight:700;color:#e0e6ef;min-width:24px;text-align:right}
.donut-pct{color:#6b7280;font-size:11px;margin-left:auto}
/* ---- 在途面板 ---- */
.transit-panel{background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap}
.transit-panel .tp-label{color:#fbbf24;font-weight:600}
.transit-panel .tp-count{color:#fbbf24;font-size:20px;font-weight:700}
.transit-panel .tp-hint{color:#6b7280;font-size:11px}
.transit-panel .tp-clear{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .15s}
.transit-panel .tp-clear:hover{background:rgba(239,68,68,.2)}
@media(max-width:600px){
  .header-left h1{font-size:18px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-card{padding:14px;border-radius:12px}
  .stat-card .value{font-size:22px}
  .table-wrap{border-radius:12px}
  table{font-size:12px}
  thead th,tbody td{padding:8px 10px}
  .title-cell{max-width:100px}
  .header-right .time-badge{font-size:11px;padding:6px 10px}
}
.fade-in{animation:fadeIn .5s ease-out forwards;opacity:0}
@keyframes fadeIn{to{opacity:1}}
footer{text-align:center;padding:24px 0 12px;font-size:11px;color:#374151}
</style>
</head>

  </div>

  <footer>顺运宝 · 库存监控系统 · 数据自动同步 GitHub Pages</footer>
</div>

// ====== 在途管理 (localStorage) ======
const TRANSIT_KEY = 'hermes_transit_v2';

function loadTransit() {
  try { const r = localStorage.getItem(TRANSIT_KEY); return r ? JSON.parse(r) : {}; }
  catch(e) { return {}; }
}
function saveTransit(map) { localStorage.setItem(TRANSIT_KEY, JSON.stringify(map)); }

function getTransit(sku) {
  const map = loadTransit();
  if (sku in map) return map[sku];
  const d = DATA.find(r => r.sku === sku);
  return d ? (d.transit || 0) : 0;
}

function setTransit(sku, val) {
  const map = loadTransit();
  if (val <= 0) delete map[sku];
  else map[sku] = val;
  saveTransit(map);
  refreshAll();
}

function totalTransit() {
  return DATA.reduce((s, d) => s + getTransit(d.sku), 0);
}

// ---- 编辑在途 ----
function editTransit(sku) {
  var cur = getTransit(sku);
  var n = prompt('输入 ' + sku + ' 在途数量：', cur || '');
  if (n === null) return;
  var v = parseInt(n, 10);
  if (isNaN(v) || v < 0) return;
  setTransit(sku, v);
}

// ---- 收货抵达 ----
function receiveTransit(sku) {
  var cur = getTransit(sku);
  if (cur <= 0) return;
  if (!confirm(sku + '\n在途 ' + cur + ' 件已抵达仓库？\n（将从在途中移除）')) return;
  // flash animation
  var el = document.getElementById('tr-' + CSS.escape(sku));
  if (el) { el.classList.add('received'); }
  // delay clear for animation
  setTimeout(function() { setTransit(sku, 0); }, 400);
}

// ---- 一键清空所有在途 ----
function clearAllTransit() {
  var t = totalTransit();
  if (t <= 0) return;
  if (!confirm('确认清空全部 ' + t + ' 件在途？\n（所有在途标记为已抵达）')) return;
  localStorage.removeItem(TRANSIT_KEY);
  refreshAll();
}

function renderTable() {
  var search = document.getElementById('searchInput').value.toLowerCase();
  var filtered = DATA.filter(function(d){
    if (currentFilter === 'out' && d.stock !== 0) return false;

    if (search && d.sku.toLowerCase().indexOf(search) === -1 && d.title.toLowerCase().indexOf(search) === -1 && d.invCode.toLowerCase().indexOf(search) === -1) return false;
    return true;
  });

  var html = '';
  filtered.forEach(function(d){
    var badgeClass, badgeIcon;
    if (d.stock === 0) { badgeClass = 'critical'; badgeIcon = '🔴'; }
    else if (d.stock <= 3) { badgeClass = 'low'; badgeIcon = '🟡'; }
    else { badgeClass = 'ok'; badgeIcon = '✅'; }

    var rep = REPLENISH[d.sku] || {};
    var daily = rep.daily || '-';

    var t = getTransit(d.sku);

    html += '<tr>' +

// ====== 复制 SKU ======
function copySKU(text, btn) {
  navigator.clipboard.writeText(text).then(function(){
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  }).catch(function(){
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  });
}

function initCharts() {
  var skuDays = DATA.map(function(d){
    var rep = REPLENISH[d.sku] || {};
    var daily = rep.daily || 0;
    var days = daily > 0 ? Math.round((d.stock / daily) * 10) / 10 : 999;
    return { sku: d.sku, stock: d.stock, daily: daily, days: days };
  });

  // 🚨 急需补货
  var restock = skuDays.filter(function(s){return s.daily > 0;}).sort(function(a,b){return a.days - b.days;}).slice(0, 10);
  var maxDays = Math.max.apply(null, restock.map(function(s){return s.days;}).concat([1]));
  var restockHTML = '';
  restock.forEach(function(s){
    var pct = Math.max(2, (s.days / maxDays) * 100);
    var cls = s.days < 1 ? 'danger' : s.days < 3 ? 'warn' : 'ok';
    restockHTML += '<div class="bar-row"><span class="bar-label">' + s.sku + '</span><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div><span class="bar-val">' + s.days + '天</span></div>';
  });
  document.getElementById('restockBars').innerHTML = restockHTML || '<span style="color:#6b7280;font-size:12px">暂无销量数据</span>';

  // 🔥 销售排行
  var sales = skuDays.filter(function(s){return s.daily > 0;}).sort(function(a,b){return b.daily - a.daily;}).slice(0, 10);
  var maxDaily = Math.max.apply(null, sales.map(function(s){return s.daily;}).concat([1]));
  var salesHTML = '';
  sales.forEach(function(s){
    var pct = Math.max(2, (s.daily / maxDaily) * 100);
    salesHTML += '<div class="bar-row"><span class="bar-label">' + s.sku + '</span><div class="bar-track"><div class="bar-fill sales" style="width:' + pct + '%"></div></div><span class="bar-val">' + s.daily + '/天</span></div>';
  });
  document.getElementById('salesBars').innerHTML = salesHTML || '<span style="color:#6b7280;font-size:12px">暂无销量数据</span>';

  // 📊 库存天数分布
  var buckets = [
    { label: '<3天', color: '#ef4444', min: 0, max: 3 },
    { label: '3~7天', color: '#fbbf24', min: 3, max: 7 },
    { label: '7~14天', color: '#38bdf8', min: 7, max: 14 },
    { label: '>14天', color: '#22c55e', min: 14, max: 9999 }
  ];
  var withSales = skuDays.filter(function(s){return s.daily > 0;});
  var donutHTML = '';
  buckets.forEach(function(b){
    var n = withSales.filter(function(s){return s.days >= b.min && s.days < b.max;}).length;
    var pct = withSales.length > 0 ? Math.round(n / withSales.length * 100) : 0;
    donutHTML += '<div class="donut-row"><div class="donut-dot" style="background:' + b.color + '"></div><span style="color:#9ca3af">' + b.label + '</span><span class="donut-num">' + n + '</span><span class="donut-pct">' + pct + '%</span></div>';
  });
  document.getElementById('statusDonut').innerHTML = donutHTML || '<span style="color:#6b7280;font-size:12px">暂无销量数据</span>';
}

function updateTime() {
  var now = new Date();
  var opts = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
  document.getElementById('updateTime').textContent = '📅 ' + now.toLocaleDateString('zh-CN', opts);
}
updateTime();
setInterval(updateTime, 30000);

// ====== 初始化 ======
renderStats();
renderTransitPanel();
renderTable();
initCharts();
</script>
</body>
</html>
