tr:hover{background:rgba(56,189,248,.04)}
a{color:#38bdf8;text-decoration:none;font-size:12px}
.tc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#d1d5db}
.ft{text-align:center;padding:24px 0 12px;font-size:11px;color:#374151}
@media(max-width:600px){h1{font-size:18px}.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.card .v{font-size:22px}table{font-size:12px}th,td{padding:8px 10px}.tc{max-width:120px}}

function $(id) { return document.getElementById(id); }

function init() {
  // Stats cards
  var total = DATA.length;
  var allStock = 0, zero = 0, low = 0, prodSet = {}, avail = 0;
  var statusCount = {};
  for (var i = 0; i < DATA.length; i++) {
    var d = DATA[i];
    allStock += d.k;
    if (d.k === 0) zero++;
    else if (d.k <= 3) low++;
    prodSet[d.c] = 1;
    if (d.k > 0) avail++;
    statusCount[d.x] = (statusCount[d.x] || 0) + 1;
  }
  var prodCount = Object.keys(prodSet).length;
  
  var stats = $('stats');
  stats.innerHTML = '';
  var cards = [
    {l:'Total SKU', v:total, s:prodCount + ' products'},
    {l:'In Stock', v:allStock, s:'Total available'},
    {l:'Alerts', v:(zero+low), s:'Out ' + zero + ' · Low ' + low},
    {l:'Availability', v:Math.round(avail/total*100)+'%', s:avail + '/' + total + ' in stock'}
  ];
  for (var i = 0; i < cards.length; i++) {
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="l">'+cards[i].l+'</div><div class="v">'+cards[i].v+'</div><div class="s">'+cards[i].s+'</div>';
    stats.appendChild(c);
  }
  
  // Filter bar + search
  var filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center';
  
  var allBtn = document.createElement('div');
  allBtn.style.cssText = 'padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:rgba(56,189,248,.15);border:1px solid #38bdf8;color:#38bdf8';
  allBtn.textContent = 'All (' + total + ')';
  allBtn.dataFilter = '';
  allBtn.onclick = function() { setFilter(this); };
  filterBar.appendChild(allBtn);
  
  var statusKeys = Object.keys(statusCount).sort();
  for (var i = 0; i < statusKeys.length; i++) {
    var k = statusKeys[i];
    var btn = document.createElement('div');
    btn.style.cssText = 'padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#9ca3af';
    btn.textContent = k + ' (' + statusCount[k] + ')';
    btn.dataFilter = k;
    btn.onclick = function() { setFilter(this); };
    filterBar.appendChild(btn);
  }
  
  $('tableWrap').parentNode.insertBefore(filterBar, $('tableWrap'));
  
  // Time
  updateTime();
  setInterval(updateTime, 30000);
  
  // Initial render
  window.currentFilter = '';
  render();
}

function setFilter(el) {
  var parent = el.parentNode;
  for (var i = 0; i < parent.children.length; i++) {
    parent.children[i].style.background = 'rgba(255,255,255,.04)';
    parent.children[i].style.borderColor = 'rgba(255,255,255,.08)';
    parent.children[i].style.color = '#9ca3af';
  }
  el.style.background = 'rgba(56,189,248,.15)';
  el.style.borderColor = '#38bdf8';
  el.style.color = '#38bdf8';
  window.currentFilter = el.dataFilter || '';
  render();
}

function render() {
  var q = $('q').value.toLowerCase();
  var filtered = [];
  for (var i = 0; i < DATA.length; i++) {
    var d = DATA[i];
    if (window.currentFilter && d.x !== window.currentFilter) continue;
    if (q && d.s.indexOf(q) < 0 && d.t.indexOf(q) < 0 && d.c.indexOf(q) < 0) continue;
    filtered.push(d);
  }
  
  var wrap = $('tableWrap');
  wrap.innerHTML = '';
  
  var title = document.createElement('div');
  title.style.cssText = 'padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;color:#9ca3af';
  title.textContent = 'Items (' + filtered.length + ')';
  wrap.appendChild(title);
  
  var div = document.createElement('div');
  div.style.overflowX = 'auto';
  
  var table = document.createElement('table');
  
  // Header
  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  var headers = ['SKU','Product','Spec','Stock','Transit','Total','Status'];
  var aligns = ['left','left','left','center','center','center','center'];
  for (var i = 0; i < headers.length; i++) {
    var th = document.createElement('th');
    th.textContent = headers[i];
    th.style.textAlign = aligns[i];
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  table.appendChild(thead);
  
  // Body
  var tbody = document.createElement('tbody');
  for (var i = 0; i < filtered.length; i++) {
    var d = filtered[i];
    var tr = document.createElement('tr');
    
    // SKU
    var td1 = document.createElement('td');
    var a = document.createElement('a');
    a.href = 'https://shopee.tw/search?keyword=' + encodeURIComponent(d.s);
    a.target = '_blank';
    a.textContent = d.s;
    td1.appendChild(a);
    tr.appendChild(td1);
    
    // Product name
    var td2 = document.createElement('td');
    td2.className = 'tc';
    td2.textContent = d.t;
    td2.title = d.t;
    tr.appendChild(td2);
    
    // Spec
    var td3 = document.createElement('td');
    td3.textContent = d.p;
    tr.appendChild(td3);
    
    // Stock
    var td4 = document.createElement('td');
    td4.style.textAlign = 'center';
    var span4 = document.createElement('span');
    span4.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600';
    if (d.k === 0) {
      span4.style.background = 'rgba(239,68,68,.15)';
      span4.style.color = '#ef4444';
      span4.textContent = '🔴 ' + d.k;
    } else if (d.k <= 3) {
      span4.style.background = 'rgba(251,191,36,.15)';
      span4.style.color = '#fbbf24';
      span4.textContent = '🟡 ' + d.k;
    } else {
      span4.style.background = 'rgba(34,197,94,.1)';
      span4.style.color = '#22c55e';
      span4.textContent = '✅ ' + d.k;
    }
    td4.appendChild(span4);
    tr.appendChild(td4);
    
    // Transit
    var td5 = document.createElement('td');
    td5.style.textAlign = 'center';
    td5.style.color = d.r > 0 ? '#fbbf24' : '#6b7280';
    td5.textContent = d.r || '-';
    tr.appendChild(td5);
    
    // Total
    var td6 = document.createElement('td');
    td6.style.textAlign = 'center';
    td6.style.fontWeight = '600';
    td6.textContent = d.l;
    tr.appendChild(td6);
    
    // Status
    var td7 = document.createElement('td');
    td7.style.textAlign = 'center';
    var span7 = document.createElement('span');
    span7.style.cssText = 'display:inline-flex;padding:2px 10px;border-radius:12px;font-size:11px';
    if (d.x === '已入仓') {
      span7.style.background = 'rgba(34,197,94,.1)';
      span7.style.color = '#22c55e';
    } else if (d.x === '已拆包') {
      span7.style.background = 'rgba(251,191,36,.1)';
      span7.style.color = '#fbbf24';
    } else {
      span7.style.background = 'rgba(107,114,128,.15)';
      span7.style.color = '#6b7280';
    }
    span7.textContent = d.x;
    td7.appendChild(span7);
    tr.appendChild(td7);
    
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  div.appendChild(table);
  wrap.appendChild(div);
}

$('q').oninput = render;

function updateTime() {
  var n = new Date();
  $('ts').textContent = '📅 ' + n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0') + ' ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
