<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📦 顺运宝库存看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f0f2f5;
    padding: 16px;
    color: #1a1a2e;
  }
  .header {
    text-align: center;
    padding: 20px 0 16px;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .time { font-size: 13px; color: #888; margin-top: 4px; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .stat-card .num { font-size: 28px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
  .stat-card.alert { border-left: 4px solid #ef4444; }
  .stat-card.low { border-left: 4px solid #f59e0b; }
  .stat-card.ok { border-left: 4px solid #22c55e; }
  .stat-card.total { border-left: 4px solid #6366f1; }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 640px) {
    .charts-grid { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .chart-card h3 { font-size: 14px; color: #555; margin-bottom: 12px; }
  .chart-card canvas { max-height: 240px; }
  .table-wrap {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    overflow-x: auto;
    margin-bottom: 16px;
  }
  .table-wrap h3 { font-size: 14px; color: #555; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-alert { background: #fee2e2; color: #dc2626; }
  .badge-low { background: #fef3c7; color: #d97706; }
  .badge-ok { background: #dcfce7; color: #16a34a; }
  .badge-off { background: #f3f4f6; color: #9ca3af; }
  .badge-count { background: #e0e7ff; color: #4f46e5; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 6px; color: #888; font-weight: 500; border-bottom: 1px solid #eee; white-space: nowrap; }
  td { padding: 8px 6px; border-bottom: 1px solid #f5f5f5; }
  tr.alert-row { background: #fef2f2; }
  tr.low-row { background: #fffbeb; }
  .bar-cell { display: flex; align-items: center; gap: 6px; }
  .bar { height: 8px; border-radius: 4px; min-width: 4px; transition: width 0.5s; }
  .bar-green { background: #22c55e; }
  .bar-yellow { background: #eab308; }
  .bar-red { background: #ef4444; }
  .prod-header { display: flex; align-items: center; gap: 4px; }
  .prod-header .name { font-weight: 600; }
  .prod-header .code { color: #888; font-size: 12px; font-weight: 400; }
  .footer { text-align: center; color: #bbb; font-size: 12px; padding: 20px 0; }
  .sku-detail-toggle { color: #6366f1; cursor: pointer; font-size: 12px; text-decoration: underline; }
  .sku-detail { display: none; margin-top: 8px; }
  .sku-detail.show { display: block; }
  .sku-table { font-size: 12px; }
  .sku-table td { padding: 4px 6px; }
  .last-update { font-size: 12px; color: #888; text-align: right; margin-top: 8px; }
</style>
</head>
<body>

  <h1>📦 顺运宝库存看板</h1>
  <div class="time" id="updateTime">加载中...</div>
</div>

<div class="stats-row" id="statsRow">
  <div class="stat-card total"><div class="num" id="totalStock">-</div><div class="label">总库存(件)</div></div>
  <div class="stat-card total"><div class="num" id="totalSku">-</div><div class="label">SKU总数</div></div>
  <div class="stat-card alert"><div class="num" id="alertCount">-</div><div class="label">🚨 预警</div></div>
  <div class="stat-card low"><div class="num" id="lowCount">-</div><div class="label">⚠️ 偏低</div></div>
  <div class="stat-card ok"><div class="num" id="zeroStock">-</div><div class="label">零库存</div></div>
</div>

<div class="charts-grid">
  <div class="chart-card"><h3>📊 各商品库存分布</h3><canvas id="stockChart"></canvas></div>
  <div class="chart-card"><h3>🥧 SKU状态占比</h3><canvas id="pieChart"></canvas></div>
</div>

<div class="table-wrap">

  </tr></thead><tbody id="productTable"></tbody></table>
</div>

<div class="footer">
  数据来源：顺运宝ERP &nbsp;|&nbsp; 每30分钟自动更新
</div>

// ====== 渲染 ======
const products = DATA.products;
const totalStock = products.reduce((s, p) => s + p.totalStock, 0);
const totalSku = products.reduce((s, p) => s + p.skuCount, 0);
const totalAlert = products.reduce((s, p) => s + p.skus.filter(x => x.status === 'alert').length, 0);
const totalLow = products.reduce((s, p) => s + p.skus.filter(x => x.status === 'low').length, 0);
const totalZero = products.reduce((s, p) => s + p.skus.filter(x => x.stock === 0).length, 0);

document.getElementById('totalStock').textContent = totalStock;
document.getElementById('totalSku').textContent = totalSku;
document.getElementById('alertCount').textContent = totalAlert;
document.getElementById('lowCount').textContent = totalLow;
document.getElementById('zeroStock').textContent = totalZero;
document.getElementById('productCount').textContent = products.length + '个商品';
document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');

// 商品表格
const tbody = document.getElementById('productTable');
products.forEach(p => {
  const alertSku = p.skus.filter(s => s.status === 'alert').length;
  const lowSku = p.skus.filter(s => s.status === 'low').length;
  const barPct = Math.min(p.rate, 100);
  const barColor = p.rate === 0 ? 'red' : p.rate < 50 ? 'yellow' : 'green';

  let alertBadge = '';
  if (alertSku > 0) alertBadge = `<span class="badge badge-alert">${alertSku}预警</span>`;
  else if (lowSku > 0) alertBadge = `<span class="badge badge-low">${lowSku}偏低</span>`;
  else alertBadge = `<span class="badge badge-ok">正常</span>`;

  const row = document.createElement('tr');
  row.className = alertSku > 0 ? 'alert-row' : lowSku > 0 ? 'low-row' : '';
  row.innerHTML = `
    <td><div class="prod-header"><span class="code">${p.code}</span></div><div class="name">${p.name.slice(0, 18)}</div></td>
    <td>${p.skuCount}</td>
    <td>${p.totalStock}</td>
    <td>${p.inTransit}</td>
    <td><strong>${p.available}</strong></td>
    <td><div class="bar-cell"><div class="bar bar-${barColor}" style="width:${barPct}%"></div>${p.rate}%</div></td>
    <td>${alertBadge}</td>
    <td><span class="sku-detail-toggle" onclick="toggleSku('${p.code}')">▼ 展开</span></td>
  `;
  tbody.appendChild(row);

  // SKU明细行
  const detailRow = document.createElement('tr');
  detailRow.id = `detail-${p.code}`;
  detailRow.className = 'sku-detail';
  detailRow.innerHTML = `<td colspan="8"><div class="sku-detail-content"><table class="sku-table" style="width:100%"><thead><tr><th>子编码</th><th>规格</th><th>库存</th><th>状态</th></tr></thead><tbody>${p.skus.map(s => {
    let badge = '<span class="badge badge-ok">正常</span>';
    if (s.status === 'alert') badge = `<span class="badge badge-alert">预警</span>`;
    else if (s.status === 'low') badge = `<span class="badge badge-low">偏低</span>`;
    else if (s.status === 'unmonitored') badge = '<span class="badge badge-off">未监控</span>';
    return `<tr class="${s.status === 'alert' ? 'alert-row' : s.status === 'low' ? 'low-row' : ''}"><td>${s.sku}</td><td>${s.spec}</td><td>${s.stock}</td><td>${badge}</td></tr>`;
  }).join('')}</tbody></table></div></td>`;
  tbody.appendChild(detailRow);
});

function toggleSku(code) {
  const el = document.getElementById('detail-' + code);
  el.classList.toggle('show');
}

// 库存条形图
const ctx1 = document.getElementById('stockChart').getContext('2d');
new Chart(ctx1, {
  type: 'bar',
  data: {
    labels: products.map(p => p.code),
    datasets: [{
      label: '可用库存',
      data: products.map(p => p.available),
      backgroundColor: products.map(p => {
        const a = p.skus.filter(s => s.status === 'alert').length;
        const l = p.skus.filter(s => s.status === 'low').length;
        return a > 0 ? '#ef4444' : l > 0 ? '#f59e0b' : '#22c55e';
      }),
      borderRadius: 4
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
      x: { grid: { display: false }, ticks: { font: { size: 10 } } }
    }
  }
});

// 饼图
const ctx2 = document.getElementById('pieChart').getContext('2d');
const inStock = totalSku - totalZero;
new Chart(ctx2, {
  type: 'doughnut',
  data: {
    labels: ['有库存', '零库存'],
    datasets: [{
      data: [inStock, totalZero],
      backgroundColor: ['#22c55e', '#e5e7eb'],
      borderWidth: 0
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom', labels: { font: { size: 12 } } }
    },
    cutout: '65%'
  }
});
</script>
</body>
</html>
